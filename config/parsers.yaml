# ============================================================================
# Web3 XDR - Event Parsers Configuration
# ============================================================================
# This file defines how raw blockchain events are normalized into unified format
# Edit these parsers to customize event detection and classification
# ============================================================================

version: "1.0"
last_updated: "2026-01-05"

# ============================================================================
# EVM Event Signatures
# ============================================================================
# Format: signature_hash -> (event_name, severity, estimated_usd_threshold)
# Signature = keccak256(EventName(param1,param2,...))

evm_signatures:
  # ─────────────────────────────────────────────────────────────────────────
  # Token Events (Low Severity - Normal Operations)
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
    name: "Transfer"
    description: "ERC20/ERC721 Token Transfer"
    severity: "low"
    estimated_usd: 0
    abi: "Transfer(address indexed from, address indexed to, uint256 value)"
    category: "token"
    
  - signature: "0x8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b925"
    name: "Approval"
    description: "ERC20 Token Approval"
    severity: "low"
    estimated_usd: 0
    abi: "Approval(address indexed owner, address indexed spender, uint256 value)"
    category: "token"

  # ─────────────────────────────────────────────────────────────────────────
  # Bridge Events - Wormhole (High/Critical Severity)
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0x6eb224fb001ed210e379b335e35efe88672a8ce935d981a6896b27ffdf52a3b2"
    name: "LogMessagePublished"
    description: "Wormhole cross-chain message published"
    severity: "high"
    estimated_usd: 50000
    abi: "LogMessagePublished(address indexed sender, uint64 sequence, uint32 nonce, bytes payload, uint8 consistencyLevel)"
    category: "bridge"
    protocol: "wormhole"
    
  - signature: "0x1b2a7ff080b8cb6ff436ce0372e399692bbfb6d4ae5766fd8d58a7b8cc6142e6"
    name: "TransferRedeemed"
    description: "Wormhole transfer redeemed (tokens unlocked)"
    severity: "critical"
    estimated_usd: 100000
    abi: "TransferRedeemed(uint16 indexed emitterChainId, bytes32 indexed emitterAddress, uint64 indexed sequence)"
    category: "bridge"
    protocol: "wormhole"

  # ─────────────────────────────────────────────────────────────────────────
  # Bridge Events - Generic (Medium/High Severity)
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0xe1fffcc4923d04b559f4d29a8bfc6cda04eb5b0d3c460751c2402c5c5cc9109c"
    name: "Deposit"
    description: "Generic bridge deposit"
    severity: "medium"
    estimated_usd: 10000
    abi: "Deposit(address indexed dst, uint256 wad)"
    category: "bridge"
    
  - signature: "0x7fcf532c15f0a6db0bd6d0e038bea71d30d808c7d98cb3bf7268a95bf5081b65"
    name: "Withdrawal"
    description: "Generic bridge withdrawal"
    severity: "high"
    estimated_usd: 50000
    abi: "Withdrawal(address indexed src, uint256 wad)"
    category: "bridge"

  # ─────────────────────────────────────────────────────────────────────────
  # LayerZero Events
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0x44b559f101f8fbcc8a0ea43fa91a05a729a5ea6e14a7c75aa750374690137208"
    name: "PacketSent"
    description: "LayerZero cross-chain packet sent"
    severity: "low"
    estimated_usd: 0
    abi: "PacketSent(bytes encodedPayload, bytes options, address sendLibrary)"
    category: "bridge"
    protocol: "layerzero"
    
  - signature: "0xe9bded5f24a4168e4f3bf44e00298c993b22376aad8c58c7dda9718a54cbea82"
    name: "PacketReceived"
    description: "LayerZero cross-chain packet received"
    severity: "medium"
    estimated_usd: 10000
    abi: "PacketReceived(Origin origin, address receiver)"
    category: "bridge"
    protocol: "layerzero"

  # ─────────────────────────────────────────────────────────────────────────
  # Stargate Events
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0x34660fc8af304464529f48a778e03d03e4d34bcd5f9b6f0cfbf3cd238c642f7f"
    name: "Swap"
    description: "Stargate cross-chain swap"
    severity: "medium"
    estimated_usd: 5000
    abi: "Swap(uint16 chainId, uint256 dstPoolId, address from, uint256 amountSD, uint256 eqReward, uint256 eqFee, uint256 protocolFee, uint256 lpFee)"
    category: "bridge"
    protocol: "stargate"

  # ─────────────────────────────────────────────────────────────────────────
  # DeFi Events - Flash Loans
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0x631042c832b07452973831137f2d73e395028b44b250dedc5abb0ee766e168ac"
    name: "FlashLoan"
    description: "Aave flash loan executed"
    severity: "high"
    estimated_usd: 100000
    abi: "FlashLoan(address indexed target, address indexed initiator, address indexed asset, uint256 amount, uint256 premium, uint16 referralCode)"
    category: "defi"
    protocol: "aave"

  # ─────────────────────────────────────────────────────────────────────────
  # Governance Events (High Severity - Admin Actions)
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0x8be0079c531659141344cd1fd0a4f28419497f9722a3daafe3b4186f6b6457e0"
    name: "OwnershipTransferred"
    description: "Contract ownership transferred"
    severity: "critical"
    estimated_usd: 0
    abi: "OwnershipTransferred(address indexed previousOwner, address indexed newOwner)"
    category: "governance"
    
  - signature: "0x2f8788117e7eff1d82e926ec794901d17c78024a50270940304540a733656f0d"
    name: "RoleGranted"
    description: "Access control role granted"
    severity: "high"
    estimated_usd: 0
    abi: "RoleGranted(bytes32 indexed role, address indexed account, address indexed sender)"
    category: "governance"
    
  - signature: "0xf6391f5c32d9c69d2a47ea670b442974b53935d1edc7fd64eb21e047a839171b"
    name: "RoleRevoked"
    description: "Access control role revoked"
    severity: "high"
    estimated_usd: 0
    abi: "RoleRevoked(bytes32 indexed role, address indexed account, address indexed sender)"
    category: "governance"

  # ─────────────────────────────────────────────────────────────────────────
  # Contract Upgrade Events (Critical)
  # ─────────────────────────────────────────────────────────────────────────
  
  - signature: "0xbc7cd75a20ee27fd9adebab32041f755214dbc6bffa90cc0225b39da2e5c2d3b"
    name: "Upgraded"
    description: "Proxy contract upgraded to new implementation"
    severity: "critical"
    estimated_usd: 0
    abi: "Upgraded(address indexed implementation)"
    category: "governance"

# ============================================================================
# Cosmos Event Types
# ============================================================================

cosmos_events:
  # IBC Events
  - type: "ibc_transfer"
    name: "IBC Transfer"
    description: "Inter-Blockchain Communication transfer"
    severity: "medium"
    category: "bridge"
    
  - type: "send_packet"
    name: "Send Packet"
    description: "IBC packet sent"
    severity: "low"
    category: "bridge"
    
  - type: "recv_packet"
    name: "Receive Packet"
    description: "IBC packet received"
    severity: "medium"
    category: "bridge"
    
  - type: "acknowledge_packet"
    name: "Acknowledge Packet"
    description: "IBC packet acknowledged"
    severity: "low"
    category: "bridge"
    
  # Governance
  - type: "submit_proposal"
    name: "Submit Proposal"
    description: "Governance proposal submitted"
    severity: "high"
    category: "governance"
    
  - type: "proposal_vote"
    name: "Proposal Vote"
    description: "Vote on governance proposal"
    severity: "medium"
    category: "governance"

# ============================================================================
# Aptos/Sui Event Types (Move-based)
# ============================================================================

move_events:
  # Bridge functions to detect
  bridge_functions:
    - "bridge::transfer"
    - "wormhole::transfer_tokens"
    - "layerzero::send"
    - "token_bridge::transfer_tokens"
    - "portal::deposit"
    - "portal::withdraw"
    
  # Severity mapping by function pattern
  severity_patterns:
    - pattern: "transfer"
      severity: "low"
    - pattern: "bridge"
      severity: "high"
    - pattern: "withdraw"
      severity: "high"
    - pattern: "mint"
      severity: "critical"
    - pattern: "burn"
      severity: "high"
    - pattern: "upgrade"
      severity: "critical"
    - pattern: "admin"
      severity: "critical"

# ============================================================================
# Near Event Types
# ============================================================================

near_events:
  action_types:
    - type: "FunctionCall"
      name: "Function Call"
      severity: "low"
      
    - type: "Transfer"
      name: "NEAR Transfer"
      severity: "low"
      
    - type: "DeployContract"
      name: "Deploy Contract"
      severity: "high"
      
    - type: "DeleteAccount"
      name: "Delete Account"
      severity: "critical"
      
  # Bridge contracts to monitor
  bridge_contracts:
    - "aurora"
    - "rainbow-bridge"
    - "near-eth-connector"

# ============================================================================
# Severity Definitions
# ============================================================================

severity_levels:
  low:
    value: 1
    color: "#4ade80"
    description: "Normal operations, informational"
    response: "Log only"
    
  medium:
    value: 2
    color: "#facc15"
    description: "Unusual activity, worth monitoring"
    response: "Alert if threshold exceeded"
    
  high:
    value: 3
    color: "#f97316"
    description: "Suspicious activity, potential attack"
    response: "Immediate alert, investigate"
    
  critical:
    value: 4
    color: "#ef4444"
    description: "Active attack or critical security event"
    response: "Emergency response, consider pause"

# ============================================================================
# Category Definitions
# ============================================================================

categories:
  token:
    name: "Token Operations"
    description: "ERC20/ERC721 token transfers and approvals"
    icon: "💰"
    
  bridge:
    name: "Bridge Operations"
    description: "Cross-chain bridge deposits, withdrawals, and messages"
    icon: "🌉"
    
  governance:
    name: "Governance"
    description: "Admin actions, role changes, and contract upgrades"
    icon: "🏛️"
    
  defi:
    name: "DeFi Operations"
    description: "Flash loans, swaps, and liquidity operations"
    icon: "📊"

