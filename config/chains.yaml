# ============================================================================
# Invariant Configuration
# ============================================================================
invariants:
  # Core economic invariant
  mint_lock_parity:
    enabled: true
    tolerance_window_minutes: 10
    tolerance_amount: 0.01

  # TVL drain detection
  tvl_velocity:
    enabled: true
    max_drain_percent_per_hour: 10.0
    min_drain_usd: 100000

  # Transaction velocity
  transaction_velocity:
    enabled: true
    max_tx_per_hour: 1000
    spike_multiplier: 5.0

  # Large transaction detection
  large_transaction:
    enabled: true
    threshold_usd: 100000
    max_per_hour: 5

  # Admin action monitoring
  admin_action:
    enabled: true
    max_actions_per_hour: 5

# ============================================================================
# Alerting Configuration
# ============================================================================
alerting:
  # Telegram (recommended for critical alerts)
  telegram_enabled: false
  telegram_bot_token: ""  # Get from @BotFather
  telegram_critical_channel: ""  # Channel ID for critical alerts
  telegram_general_channel: ""   # Channel ID for all alerts

  # Slack
  slack_enabled: false
  slack_webhook_url: ""  # Incoming webhook URL
  slack_critical_channel: "#security-critical"
  slack_general_channel: "#security-alerts"

  # Rate limiting
  min_alert_interval_seconds: 60
  max_alerts_per_hour: 50

# ============================================================================
# Dashboard Configuration
# ============================================================================
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080
