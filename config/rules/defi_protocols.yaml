# ============================================================================
# DEFI PROTOCOL-SPECIFIC ALERT RULES
# Custom rules for monitoring popular DeFi protocols
# ============================================================================

rules:
  # ==========================================================================
  # AAVE PROTOCOL RULES
  # ==========================================================================

  - id: aave-flash-loan-001
    name: Aave Flash Loan Large Amount
    description: |
      Detects large flash loans from Aave protocol which could be used
      in price manipulation or exploit attacks.
    severity: high
    confidence: 0.75
    enabled: true

    detection:
      type: event
      event_type: FlashLoan
      chain: any
      contracts:
        - "0x7d2768dE32b0b80b7a3454c06BdAc94A69DDc7A9"  # Aave V2 LendingPool
        - "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"  # Aave V3 Pool
      conditions:
        - field: amount_usd
          operator: gt
          value: 10000000  # $10M+

    thresholds:
      min_amount_usd: 10000000

    actions:
      - type: alert
        channels: [slack]
        priority: P2
      - type: runbook
        steps:
          - "1. Check if flash loan is part of known arbitrage bot"
          - "2. Monitor for subsequent suspicious transactions"
          - "3. Check affected protocol liquidity"

  - id: aave-liquidation-002
    name: Aave Mass Liquidation Event
    description: |
      Detects multiple liquidations in short time period, indicating
      potential market manipulation or oracle attack.
    severity: high
    confidence: 0.80
    enabled: true

    detection:
      type: event
      event_type: LiquidationCall
      chain: any

      aggregation:
        function: count
        group_by: [chain]
        time_window: 10m
        threshold: 10  # >10 liquidations in 10 minutes

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  - id: aave-borrow-spike-003
    name: Aave Abnormal Borrow Rate
    description: |
      Detects sudden spike in borrow activity which could indicate
      protocol exploitation or market manipulation.
    severity: medium
    confidence: 0.65
    enabled: false  # DISABLED 2026-04-11: 100% FP — no per-pool grouping, normal borrow volume exceeds threshold

    detection:
      type: velocity
      event_type: Borrow
      metric: events_per_minute
      threshold: 50

    time_window: 5m

    actions:
      - type: alert
        channels: [slack]
        priority: P3

  # ==========================================================================
  # UNISWAP PROTOCOL RULES
  # ==========================================================================

  - id: uniswap-large-swap-001
    name: Uniswap Large Swap Detected
    description: |
      Detects unusually large swaps on Uniswap which could indicate
      whale activity or potential price manipulation.
    severity: medium
    confidence: 0.60
    enabled: false  # DISABLED 2026-04-11: 100% FP — normal Uniswap volume, $1M swaps are routine

    detection:
      type: event
      event_type: Swap
      contracts:
        - "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"  # Uniswap V3 Router
        - "0xE592427A0AEce92De3Edee1F18E0157C05861564"  # Uniswap V3 SwapRouter
      conditions:
        - field: amount_usd
          operator: gt
          value: 1000000

    thresholds:
      min_amount_usd: 1000000  # $1M+

    actions:
      - type: alert
        channels: [slack]
        priority: P3

  - id: uniswap-pool-drain-002
    name: Uniswap Liquidity Pool Drain
    description: |
      Detects rapid removal of liquidity from Uniswap pools which
      could indicate rug pull or exit scam.
    severity: critical
    confidence: 0.85
    enabled: true

    detection:
      type: event
      event_type: Burn  # LP token burn = liquidity removal
      conditions:
        - field: liquidity_removed_percent
          operator: gt
          value: 50  # >50% of pool liquidity

    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1
      - type: runbook
        steps:
          - "1. Identify the affected pool and token"
          - "2. Check if this is a known project"
          - "3. Alert community if rug pull confirmed"

  - id: uniswap-sandwich-003
    name: Uniswap Sandwich Attack Pattern
    description: |
      Detects sandwich attack pattern where attacker front-runs and
      back-runs a victim transaction.
    severity: medium
    confidence: 0.70
    enabled: true

    detection:
      type: pattern
      pattern: sandwich_attack
      conditions:
        - field: same_block
          operator: eq
          value: true
        - field: swap_count
          operator: gte
          value: 3
        - field: profit_usd
          operator: gt
          value: 1000

    actions:
      - type: alert
        channels: [slack]
        priority: P3

  # ==========================================================================
  # COMPOUND PROTOCOL RULES
  # ==========================================================================

  - id: compound-oracle-manipulation-001
    name: Compound Oracle Price Deviation
    description: |
      Detects significant price deviation in Compound oracle which
      could indicate oracle manipulation attack.
    severity: critical
    confidence: 0.90
    enabled: true

    detection:
      type: event
      event_type: PriceUpdated
      contracts:
        - "0x50ce56A3239671Ab62f185704Caedf626352741e"  # Compound Price Oracle
      conditions:
        - field: price_deviation_percent
          operator: gt
          value: 10  # >10% deviation

    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1
      - type: runbook
        steps:
          - "1. Compare oracle price with CEX prices"
          - "2. Check for flash loan in same block"
          - "3. Prepare to pause protocol if attack confirmed"

  - id: compound-governance-attack-002
    name: Compound Governance Proposal Anomaly
    description: |
      Detects suspicious governance activity like rapid proposal
      creation or unusual voting patterns.
    severity: high
    confidence: 0.75
    enabled: true

    detection:
      type: event
      event_type:
        - ProposalCreated
        - VoteCast
      contracts:
        - "0xc0Da02939E1441F497fd74F78cE7Decb17B66529"  # Compound Governor

      aggregation:
        function: count
        time_window: 1h
        threshold: 5

    actions:
      - type: alert
        channels: [slack]
        priority: P2

  # ==========================================================================
  # MAKERDAO PROTOCOL RULES
  # ==========================================================================

  - id: maker-vault-liquidation-001
    name: MakerDAO Mass Vault Liquidation
    description: |
      Detects mass liquidation of Maker vaults which could indicate
      market crash or oracle manipulation.
    severity: high
    confidence: 0.85
    enabled: true

    detection:
      type: event
      event_type: Bite  # Vault liquidation event
      contracts:
        - "0x35D1b3F3D7966A1DFe207aa4514C12a259A0492B"  # MakerDAO Dog

      aggregation:
        function: count
        time_window: 10m
        threshold: 20

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  - id: maker-dai-peg-002
    name: DAI Peg Deviation
    description: |
      Detects significant deviation of DAI from $1 peg which could
      indicate market stress or attack.
    severity: high
    confidence: 0.80
    enabled: true

    detection:
      type: invariant
      invariant: STABLECOIN_PEG
      conditions:
        - field: price_deviation_percent
          operator: gt
          value: 2  # >2% deviation from $1

    thresholds:
      min_deviation_percent: 2

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  # ==========================================================================
  # CURVE FINANCE RULES
  # ==========================================================================

  - id: curve-pool-imbalance-001
    name: Curve Pool Severe Imbalance
    description: |
      Detects severe imbalance in Curve pools which could indicate
      depeg event or liquidity attack.
    severity: high
    confidence: 0.80
    enabled: true

    detection:
      type: event
      event_type:
        - TokenExchange
        - RemoveLiquidity
      conditions:
        - field: pool_imbalance_percent
          operator: gt
          value: 20  # >20% imbalance

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  - id: curve-depeg-alert-002
    name: Curve Stablecoin Depeg Alert
    description: |
      Detects stablecoin depeg in Curve pools (like UST, USDC events).
    severity: critical
    confidence: 0.90
    enabled: true

    detection:
      type: invariant
      invariant: STABLECOIN_PEG
      contracts:
        - "0xbEbc44782C7dB0a1A60Cb6fe97d0b483032FF1C7"  # Curve 3pool
        - "0xDC24316b9AE028F1497c275EB9192a3Ea0f67022"  # Curve stETH
      conditions:
        - field: token_price_deviation
          operator: gt
          value: 5  # >5% from expected price

    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1

  # ==========================================================================
  # LIDO PROTOCOL RULES
  # ==========================================================================

  - id: lido-steth-depeg-001
    name: Lido stETH Depeg Alert
    description: |
      Detects significant deviation of stETH from ETH price.
    severity: high
    confidence: 0.85
    enabled: true

    detection:
      type: invariant
      invariant: STETH_PEG
      conditions:
        - field: steth_eth_ratio
          operator: lt
          value: 0.95  # stETH trading at <95% of ETH

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  # ==========================================================================
  # GENERIC DEFI RULES
  # ==========================================================================

  - id: defi-reentrancy-pattern-001
    name: Potential Reentrancy Attack Pattern
    description: |
      Detects patterns consistent with reentrancy attacks - multiple
      calls to same function in single transaction.
    severity: critical
    confidence: 0.75
    enabled: true

    detection:
      type: pattern
      pattern: reentrancy
      conditions:
        - field: recursive_calls
          operator: gt
          value: 3
        - field: same_transaction
          operator: eq
          value: true

    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1

  - id: defi-access-control-001
    name: Unauthorized Admin Function Call
    description: |
      Detects calls to admin/owner functions from non-admin addresses.
      Overlaps with admin-change-ft007 — this rule focuses on Pause/Unpause events.
    severity: critical
    confidence: 0.90
    enabled: true

    detection:
      type: event
      event_type:
        - OwnershipTransferred
        - AdminChanged
        - RoleGranted
        - Paused
        - Unpaused

    exclusions:
      addresses:
        - "0x000100abaad02f1cfc8bbe32bd5a564817339e72"  # Known Base deployer/factory

    rate_limit:
      max_alerts: 5
      period: 1h

    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P1

  - id: defi-token-approval-exploit-001
    name: Suspicious Token Approval Pattern
    description: |
      Detects unlimited token approvals to suspicious or new contracts.
    severity: medium
    confidence: 0.60
    enabled: true

    detection:
      type: event
      event_type: Approval
      conditions:
        - field: amount
          operator: eq
          value: unlimited
        - field: spender_age_hours
          operator: lt
          value: 24

    actions:
      - type: alert
        channels: [slack]
        priority: P3
