# ============================================================================
# PROTOCOL-SPECIFIC ALERT RULES
# Comprehensive monitoring rules for all 21 DeFi protocols
# ============================================================================

rules:
  # ==========================================================================
  # LENDING PROTOCOLS
  # ==========================================================================

  # --------------------------------------------------------------------------
  # AAVE V3
  # --------------------------------------------------------------------------
  - id: aave-liquidation-critical
    name: Aave Large Liquidation
    description: Critical liquidation event on Aave V3 exceeding $500K
    severity: critical
    confidence: 0.95
    enabled: true
    protocol: aave_v3
    detection:
      type: event
      event_type: LiquidationCall
      chain: any
    thresholds:
      min_amount_usd: 500000
    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1

  - id: aave-health-factor-warning
    name: Aave Health Factor Warning
    description: Position health factor approaching liquidation threshold
    severity: high
    confidence: 0.85
    enabled: true
    protocol: aave_v3
    detection:
      type: invariant
      invariant: HEALTH_FACTOR
      conditions:
        - field: health_factor
          operator: lt
          value: 1.2
    actions:
      - type: alert
        channels: [slack]
        priority: P2

  - id: aave-flash-loan-attack
    name: Aave Flash Loan Attack Pattern
    description: Suspicious flash loan activity with high value
    severity: high
    confidence: 0.80
    enabled: true
    protocol: aave_v3
    detection:
      type: event
      event_type: FlashLoan
      chain: any
    thresholds:
      min_amount_usd: 1000000
    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P2

  # --------------------------------------------------------------------------
  # COMPOUND
  # --------------------------------------------------------------------------
  - id: compound-liquidation-critical
    name: Compound Large Liquidation
    description: Critical liquidation event on Compound
    severity: critical
    confidence: 0.95
    enabled: true
    protocol: compound
    detection:
      type: event
      event_type: LiquidateBorrow
      chain: any
    thresholds:
      min_amount_usd: 500000
    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1

  - id: compound-utilization-spike
    name: Compound Utilization Spike
    description: Market utilization exceeds 95%
    severity: high
    confidence: 0.90
    enabled: true
    protocol: compound
    detection:
      type: invariant
      invariant: UTILIZATION_RATE
      conditions:
        - field: utilization
          operator: gt
          value: 95
    actions:
      - type: alert
        channels: [slack]
        priority: P2

  # --------------------------------------------------------------------------
  # MAKERDAO
  # --------------------------------------------------------------------------
  - id: makerdao-emergency-shutdown
    name: MakerDAO Emergency Shutdown
    description: CRITICAL - Emergency shutdown (Cage) triggered
    severity: critical
    confidence: 1.0
    enabled: true
    protocol: makerdao
    detection:
      type: event
      event_type: Cage
      chain: ethereum
    actions:
      - type: alert
        channels: [telegram, slack, pagerduty]
        priority: P1
      - type: runbook
        steps:
          - "1. IMMEDIATELY verify shutdown legitimacy"
          - "2. Check governance forum for announcements"
          - "3. Prepare user communication"
          - "4. Monitor vault liquidation queues"

  - id: makerdao-vault-liquidation
    name: MakerDAO Vault Liquidation
    description: Large vault liquidation (Bite/Bark)
