  # ==========================================================================
  # DEX PROTOCOLS
  # ==========================================================================

  # --------------------------------------------------------------------------
  # UNISWAP
  # --------------------------------------------------------------------------
  - id: uniswap-high-price-impact
    name: Uniswap High Price Impact
    description: Swap with unusually high price impact (potential manipulation)
    severity: critical
    confidence: 0.85
    enabled: false  # DISABLED 2026-04-11: 100% FP — price impact calculation unreliable, normal DEX activity
    protocol: uniswap
    detection:
      type: event
      event_type: Swap
      chain: any
    thresholds:
      price_impact_percent: 5.0
      min_amount_usd: 100000
    actions:
      - type: alert
        channels: [telegram, slack]
        priority: P1

  - id: uniswap-large-liquidity-removal
    name: Uniswap Large LP Removal
    description: Large liquidity removal (potential rug pull)
