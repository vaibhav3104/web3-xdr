# Prometheus Configuration for Sentinel3
# =====================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sentinel3-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Sentinel3 Application
  - job_name: 'sentinel3'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['sentinel3:80']
        labels:
          app: 'sentinel3'
          environment: 'production'
    
    # For Kubernetes service discovery
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - sentinel3
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     action: keep
    #     regex: sentinel3

  # Node Exporter (if deployed)
  - job_name: 'node'
    static_configs:
      - targets: []
        # - node-exporter:9100

