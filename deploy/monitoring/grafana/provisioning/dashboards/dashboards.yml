# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Sentinel3 Dashboards'
    orgId: 1
    folder: 'Sentinel3'
    folderUid: 'sentinel3'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

