# =============================================================================
# Sentinel3 - Secrets Management & External Secrets
# =============================================================================
# Uses External Secrets Operator to sync secrets from GCP Secret Manager.
# Install ESO: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# =============================================================================

# --- ClusterSecretStore: GCP Secret Manager backend ---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/name: sentinel3
    app.kubernetes.io/component: secrets
spec:
  provider:
    gcpsm:
      projectID: web3-xdr

---
# --- ExternalSecret: Database credentials ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentinel3-db-secrets
  namespace: sentinel3
  labels:
    app.kubernetes.io/name: sentinel3
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: sentinel3-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: sentinel3-postgres-host
    - secretKey: POSTGRES_USER
      remoteRef:
        key: sentinel3-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sentinel3-postgres-password
    - secretKey: INFURA_API_KEY
      remoteRef:
        key: sentinel3-infura-api-key
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: sentinel3-telegram-bot-token
    - secretKey: TELEGRAM_CHANNEL_ID
      remoteRef:
        key: sentinel3-telegram-channel-id
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: sentinel3-slack-webhook-url

---
# =============================================================================
# Encrypted Secret (for environments without External Secrets Operator)
# =============================================================================
# Use sealed-secrets or sops to encrypt before committing:
#   kubeseal --format=yaml < configmap.yaml > sealed-secrets.yaml
#
# For now, this serves as the template. DO NOT commit with real values.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sentinel3-secrets-sealed
  namespace: sentinel3
  labels:
    app.kubernetes.io/name: sentinel3
    app.kubernetes.io/component: secrets
spec:
  encryptedData:
    # Encrypted with the cluster's sealing key
    # Run: kubeseal --fetch-cert > pub-cert.pem
    # Then: echo -n "value" | kubeseal --raw --from-file=/dev/stdin --cert pub-cert.pem
    POSTGRES_PASSWORD: "<SEALED_VALUE>"
    INFURA_API_KEY: "<SEALED_VALUE>"
  template:
    metadata:
      name: sentinel3-secrets
      namespace: sentinel3
      labels:
        app.kubernetes.io/name: sentinel3
