apiVersion: v1
kind: ConfigMap
metadata:
  name: web3-xdr-config
  namespace: web3-xdr
  labels:
    app: web3-xdr
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_ENABLED: "true"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "web3_xdr"
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_BATCH_SIZE: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: web3-xdr-secrets
  namespace: web3-xdr
  labels:
    app: web3-xdr
type: Opaque
stringData:
  # Replace with actual values or use external secrets management
  POSTGRES_HOST: "postgres-host.example.com"
  POSTGRES_USER: "xdr_admin"
  POSTGRES_PASSWORD: "CHANGE_ME"
  INFURA_API_KEY: "CHANGE_ME"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHANNEL_ID: ""
  SLACK_WEBHOOK_URL: ""

