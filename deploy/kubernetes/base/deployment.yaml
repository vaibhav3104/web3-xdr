# =============================================================================
# Sentinel3 - Kubernetes Deployment
# =============================================================================
# Deploy with:
#   kubectl apply -k deploy/kubernetes/overlays/production
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel3
  namespace: sentinel3
  labels:
    app: sentinel3
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sentinel3
        component: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinel3-api
      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: sentinel3
          image: sentinel3:latest
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: sentinel3-config
            - secretRef:
                name: sentinel3-secrets
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: rules
              mountPath: /app/config/rules
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      
      volumes:
        - name: config
          configMap:
            name: sentinel3-chain-config
        - name: rules
          configMap:
            name: sentinel3-rules
        # Ephemeral writable dirs (required with readOnlyRootFilesystem)
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sentinel3
                topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sentinel3
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel3
  namespace: sentinel3
  labels:
    app: sentinel3
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: sentinel3
---
# ServiceAccounts are defined in security/rbac.yaml with per-component
# granularity (sentinel3-api, sentinel3-worker, sentinel3-gpu).
# This generic SA is kept for backward compatibility.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel3
  namespace: sentinel3
  labels:
    app: sentinel3
automountServiceAccountToken: false

