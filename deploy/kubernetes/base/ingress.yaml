apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web3-xdr
  namespace: web3-xdr
  labels:
    app: web3-xdr
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - xdr.example.com
      secretName: web3-xdr-tls
  rules:
    - host: xdr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web3-xdr
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web3-xdr
  namespace: web3-xdr
  labels:
    app: web3-xdr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web3-xdr
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web3-xdr
  namespace: web3-xdr
  labels:
    app: web3-xdr
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web3-xdr

