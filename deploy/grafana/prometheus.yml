global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Scrape Web3 XDR metrics from Cloud Run
  - job_name: 'web3-xdr-production'
    scheme: https
    static_configs:
      - targets: ['web3-xdr-production-1003459948096.us-central1.run.app']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

