# =============================================================================
# SENTINEL3 SECURE DEPLOYMENT PIPELINE
# Includes: SAST (before build) + Container Scan + Deploy + DAST (after deploy)
# =============================================================================

steps:
  # =========================================================================
  # PHASE 1: SAST (Static Application Security Testing) - BEFORE BUILD
  # =========================================================================
  
  # 1.1 - Python Security Scan with Bandit
  - name: 'python:3.11-slim'
    id: 'sast-bandit'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 SAST: Running Bandit (Python Security Scanner)..."
        pip install bandit -q
        
        # Run bandit and capture results
        bandit -r src/ -f json -o /workspace/bandit-report.json --severity-level medium 2>/dev/null || true
        
        # Show summary
        python3 << 'PYEOF'
        import json
        try:
            with open('/workspace/bandit-report.json') as f:
                data = json.load(f)
            total = len(data.get('results', []))
            high = len([r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH'])
            print(f"═══════════════════════════════════════════════════")
            print(f"📊 Bandit Results: {total} issues found ({high} high severity)")
            print(f"═══════════════════════════════════════════════════")
            if high > 10:
                print(f"❌ SAST FAILED: Too many high severity issues ({high})")
                exit(1)
        except Exception as e:
            print(f"Warning: Could not parse bandit results: {e}")
        PYEOF
        
        echo "✅ Bandit scan passed"

  # 1.2 - Dependency Vulnerability Scan with Safety
  - name: 'python:3.11-slim'
    id: 'sast-safety'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 SAST: Running Safety (Dependency Vulnerability Scanner)..."
        pip install safety -q
        
        # Run safety check
        safety check -r requirements.txt --json > /workspace/safety-report.json 2>/dev/null || true
        
        # Show summary
        python3 << 'PYEOF'
        import json
        try:
            with open('/workspace/safety-report.json') as f:
                data = json.load(f)
            vulns = len(data) if isinstance(data, list) else 0
            print(f"═══════════════════════════════════════════════════")
            print(f"📊 Safety Results: {vulns} vulnerable dependencies")
            print(f"═══════════════════════════════════════════════════")
        except Exception as e:
            print(f"Warning: Could not parse safety results: {e}")
        PYEOF
        
        # Show vulnerabilities
        safety check -r requirements.txt 2>/dev/null || true
        
        echo "✅ Safety scan complete"

  # 1.3 - Secret Detection
  - name: 'python:3.11-slim'
    id: 'sast-secrets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 SAST: Running Secret Detection..."
        pip install detect-secrets -q
        
        # Scan for secrets (exclude common false positive paths)
        detect-secrets scan --all-files \
          --exclude-files '\.git|venv|__pycache__|\.pyc|\.env\.example|node_modules' \
          > /workspace/secrets-report.json 2>/dev/null || echo '{"results":{}}' > /workspace/secrets-report.json
        
        # Show summary
        python3 << 'PYEOF'
        import json
        try:
            with open('/workspace/secrets-report.json') as f:
                data = json.load(f)
            secrets = len(data.get('results', {}))
            print(f"═══════════════════════════════════════════════════")
            print(f"📊 Secret Detection: {secrets} files with potential secrets")
            print(f"═══════════════════════════════════════════════════")
            if secrets > 0:
                print("⚠️ Review these files for hardcoded secrets:")
                for f in list(data.get('results', {}).keys())[:10]:
                    print(f"  - {f}")
        except Exception as e:
            print(f"Warning: Could not parse secrets results: {e}")
        PYEOF
        
        echo "✅ Secret detection complete"

  # 1.4 - SAST Summary Gate
  - name: 'python:3.11-slim'
    id: 'sast-gate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "🔒 SAST SECURITY GATE - SUMMARY"
        echo "═══════════════════════════════════════════════════════════════"
        
        python3 << 'PYEOF'
        import json
        import sys
        
        results = {}
        
        # Parse Bandit
        try:
            with open('/workspace/bandit-report.json') as f:
                data = json.load(f)
            results['bandit_high'] = len([r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH'])
        except:
            results['bandit_high'] = 'N/A'
        
        # Parse Safety
        try:
            with open('/workspace/safety-report.json') as f:
                data = json.load(f)
            results['safety_vulns'] = len(data) if isinstance(data, list) else 0
        except:
            results['safety_vulns'] = 'N/A'
        
        # Parse Secrets
        try:
            with open('/workspace/secrets-report.json') as f:
                data = json.load(f)
            results['secrets'] = len(data.get('results', {}))
        except:
            results['secrets'] = 'N/A'
        
        print(f"  Bandit (High Severity):   {results['bandit_high']}")
        print(f"  Safety (Vulnerabilities): {results['safety_vulns']}")
        print(f"  Secrets Detected:         {results['secrets']}")
        print("═══════════════════════════════════════════════════════════════")
        
        # Check for blockers
        if isinstance(results['bandit_high'], int) and results['bandit_high'] > 10:
            print("❌ BLOCKED: Too many high severity code issues")
            sys.exit(1)
        
        print("✅ SAST GATE: PASSED - Proceeding to build")
        PYEOF
    waitFor: ['sast-bandit', 'sast-safety', 'sast-secrets']

  # =========================================================================
  # PHASE 2: BUILD DOCKER IMAGE
  # =========================================================================
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest', '-f', 'Dockerfile', '.']
    waitFor: ['sast-gate']

  # =========================================================================
  # PHASE 3: CONTAINER SECURITY SCAN
  # =========================================================================
  
  - name: 'ghcr.io/aquasecurity/trivy:latest'
    id: 'container-scan'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "🔍 Scanning container for vulnerabilities..."
        
        # Run Trivy scan
        trivy image \
          --format json \
          --output /workspace/trivy-report.json \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest 2>/dev/null || true
        
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "🐳 CONTAINER SCAN RESULTS"
        echo "═══════════════════════════════════════════════════════════════"
        
        trivy image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest 2>/dev/null | head -100 || true
        
        echo "✅ Container scan complete"
    waitFor: ['build-image']

  # =========================================================================
  # PHASE 4: PUSH IMAGE
  # =========================================================================
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: ['push', 'us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest']
    waitFor: ['container-scan']

  # =========================================================================
  # PHASE 5: DEPLOY TO CLOUD RUN
  # =========================================================================
  
  # Deploy GPU service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-gpu'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sentinel3'
      - '--image=us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=16Gi'
      - '--cpu=4'
      - '--gpu=1'
      - '--gpu-type=nvidia-l4'
      - '--timeout=300'
      - '--set-env-vars=ML_MODEL_TYPE=transformer,ML_DEVICE=cuda,ENVIRONMENT=production,GRAPH_ENABLED=true,ML_DETECTION_ENABLED=true,NEO4J_URI=neo4j+s://4b563cb0.databases.neo4j.io,NEO4J_USERNAME=neo4j'
      - '--update-secrets=DATABASE_URL=web3-xdr-database-url:latest,NEO4J_PASSWORD=neo4j-password:latest,REDIS_URL=web3-xdr-redis-url:latest'
    waitFor: ['push-image']

  # Deploy API service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'web3-xdr-production-api'
      - '--image=us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--set-env-vars=ENVIRONMENT=production,GRAPH_ENABLED=true,ML_DETECTION_ENABLED=true,PROC_TYPE=api,NEO4J_URI=neo4j+s://4b563cb0.databases.neo4j.io,NEO4J_USERNAME=neo4j,ENABLE_RATE_LIMITING=true,RATE_LIMIT_RPM=120'
      - '--update-secrets=DATABASE_URL=web3-xdr-database-url:latest,NEO4J_PASSWORD=neo4j-password:latest,REDIS_URL=web3-xdr-redis-url:latest,SLACK_WEBHOOK_URL=web3-xdr-slack-webhook-url:latest,TELEGRAM_BOT_TOKEN=web3-xdr-telegram-bot-token:latest,TELEGRAM_CHANNEL_ID=web3-xdr-telegram-channel-id:latest'
    waitFor: ['push-image']

  # Deploy Worker service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'web3-xdr-production-worker'
      - '--image=us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--set-env-vars=ENVIRONMENT=production,GRAPH_ENABLED=true,ML_DETECTION_ENABLED=true,PROC_TYPE=worker,NEO4J_URI=neo4j+s://4b563cb0.databases.neo4j.io,NEO4J_USERNAME=neo4j,POLL_INTERVAL_SECONDS=2.0,BATCH_SIZE=10,CONTINUOUS_LEARNING_ENABLED=true'
      - '--update-secrets=DATABASE_URL=web3-xdr-database-url:latest,NEO4J_PASSWORD=neo4j-password:latest,REDIS_URL=web3-xdr-redis-url:latest,SLACK_WEBHOOK_URL=web3-xdr-slack-webhook-url:latest,TELEGRAM_BOT_TOKEN=web3-xdr-telegram-bot-token:latest,TELEGRAM_CHANNEL_ID=web3-xdr-telegram-channel-id:latest'
    waitFor: ['push-image']

  # =========================================================================
  # PHASE 6: DAST (Dynamic Application Security Testing) - AFTER DEPLOY
  # =========================================================================
  
  - name: 'python:3.11-slim'
    id: 'dast-api-security'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "🌐 DAST: Dynamic Application Security Testing"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        
        pip install requests -q
        
        # Wait for deployment to be ready
        echo "⏳ Waiting for deployment to stabilize (60s)..."
        sleep 60
        
        echo "🎯 Target: https://web3-xdr-production-api-1003459948096.us-central1.run.app"
        echo ""
        
        python3 << 'PYEOF'
        import requests
        import json
        import sys
        import os

        BASE_URL = "https://web3-xdr-production-api-1003459948096.us-central1.run.app"
        results = {"passed": 0, "failed": 0, "warnings": 0, "details": []}

        def test(name, method, path, expected_codes=[200, 404, 422], payload=None):
            """Run a security test"""
            try:
                url = f"{BASE_URL}{path}"
                if method == "GET":
                    resp = requests.get(url, timeout=10)
                else:
                    resp = requests.post(url, json=payload, timeout=10)
                
                # Check for SQL errors (indicates vulnerability)
                sql_errors = ["sql", "syntax error", "mysql", "postgresql", "sqlite"]
                has_sql_error = any(e in resp.text.lower() for e in sql_errors)
                
                if has_sql_error:
                    results["failed"] += 1
                    results["details"].append(f"❌ {name}: SQL error exposed!")
                    return False
                
                # Check for stack traces
                if "Traceback" in resp.text or "File \"/" in resp.text:
                    results["warnings"] += 1
                    results["details"].append(f"⚠️ {name}: Stack trace exposed")
                
                results["passed"] += 1
                return True
                
            except Exception as e:
                results["warnings"] += 1
                results["details"].append(f"⚠️ {name}: {str(e)[:50]}")
                return True

        print("🔍 Testing SQL Injection...")
        test("SQLi-1", "GET", "/api/incidents?severity='; DROP TABLE--")
        test("SQLi-2", "GET", "/api/incidents?limit=1 OR 1=1")
        test("SQLi-3", "GET", "/api/incidents?search=' UNION SELECT *--")

        print("🔍 Testing XSS...")
        test("XSS-1", "GET", "/api/incidents?search=<script>alert(1)</script>")
        test("XSS-2", "GET", "/api/incidents?search=<img src=x onerror=alert(1)>")

        print("🔍 Testing Path Traversal...")
        test("PathTrav-1", "GET", "/frontend/../../../etc/passwd")
        test("PathTrav-2", "GET", "/api/../../../etc/passwd")

        print("🔍 Testing Auth Bypass...")
        test("Auth-1", "GET", "/api/admin")
        test("Auth-2", "GET", "/api/internal/config")

        print("🔍 Testing Input Validation...")
        test("Input-1", "GET", "/api/incidents?limit=999999999999")
        test("Input-2", "GET", "/api/incidents?limit=-1")
        test("Input-3", "GET", "/api/incidents?offset=abc")

        print("🔍 Checking Security Headers...")
        try:
            resp = requests.get(f"{BASE_URL}/api/health", timeout=10)
            headers = resp.headers
            
            if "X-Content-Type-Options" not in headers:
                results["warnings"] += 1
                results["details"].append("⚠️ Missing X-Content-Type-Options header")
            if "X-Frame-Options" not in headers:
                results["warnings"] += 1
                results["details"].append("⚠️ Missing X-Frame-Options header")
            if "Server" in headers:
                results["warnings"] += 1
                results["details"].append(f"⚠️ Server header exposed: {headers.get('Server', 'unknown')}")
        except:
            pass

        # Print results
        print("")
        print("═" * 60)
        print("📊 DAST RESULTS")
        print("═" * 60)
        print(f"✅ Passed:   {results['passed']}")
        print(f"⚠️ Warnings: {results['warnings']}")
        print(f"❌ Failed:   {results['failed']}")
        print("")
        
        if results["details"]:
            print("Details:")
            for d in results["details"][:15]:
                print(f"  {d}")
        
        print("═" * 60)
        
        if results["failed"] > 0:
            print("🚨 DAST FAILED: Critical vulnerabilities found!")
            print("⚠️ Consider rolling back deployment")
        else:
            print("✅ DAST PASSED: No critical vulnerabilities found")

        # Save report
        with open('/workspace/dast-report.json', 'w') as f:
            json.dump(results, f)
        PYEOF
        
        echo ""
        echo "✅ DAST testing complete"
    waitFor: ['deploy-api', 'deploy-gpu', 'deploy-worker']

  # =========================================================================
  # PHASE 7: FINAL SECURITY REPORT
  # =========================================================================
  
  - name: 'python:3.11-slim'
    id: 'security-report'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ""
        echo "╔═══════════════════════════════════════════════════════════════╗"
        echo "║           🔒 SECURITY SCAN FINAL REPORT                       ║"
        echo "╠═══════════════════════════════════════════════════════════════╣"
        
        python3 << 'PYEOF'
        import json
        
        # SAST Results
        try:
            with open('/workspace/bandit-report.json') as f:
                bandit = json.load(f)
            bandit_issues = len(bandit.get('results', []))
        except:
            bandit_issues = 'N/A'
        
        try:
            with open('/workspace/safety-report.json') as f:
                safety = json.load(f)
            safety_vulns = len(safety) if isinstance(safety, list) else 0
        except:
            safety_vulns = 'N/A'
        
        try:
            with open('/workspace/secrets-report.json') as f:
                secrets = json.load(f)
            secrets_count = len(secrets.get('results', {}))
        except:
            secrets_count = 'N/A'
        
        # DAST Results
        try:
            with open('/workspace/dast-report.json') as f:
                dast = json.load(f)
            dast_passed = dast.get('passed', 'N/A')
            dast_failed = dast.get('failed', 'N/A')
            dast_warn = dast.get('warnings', 'N/A')
        except:
            dast_passed = dast_failed = dast_warn = 'N/A'
        
        print("║                                                               ║")
        print("║  📋 SAST (Static Analysis):                                   ║")
        print(f"║     • Bandit (Code Issues):     {bandit_issues:<10}                   ║")
        print(f"║     • Safety (Dep Vulns):       {safety_vulns:<10}                   ║")
        print(f"║     • Secrets Detected:         {secrets_count:<10}                   ║")
        print("║                                                               ║")
        print("║  🌐 DAST (Dynamic Analysis):                                  ║")
        print(f"║     • Tests Passed:             {dast_passed:<10}                   ║")
        print(f"║     • Tests Failed:             {dast_failed:<10}                   ║")
        print(f"║     • Warnings:                 {dast_warn:<10}                   ║")
        print("║                                                               ║")
        print("╠═══════════════════════════════════════════════════════════════╣")
        
        if dast_failed == 0 or dast_failed == 'N/A':
            print("║  ✅ DEPLOYMENT SECURE - No critical issues found             ║")
        else:
            print("║  ⚠️ REVIEW REQUIRED - Some issues need attention             ║")
        
        print("╚═══════════════════════════════════════════════════════════════╝")
        PYEOF
    waitFor: ['dast-api-security']

images:
  - 'us-central1-docker.pkg.dev/web3-xdr/sentinel3/sentinel3-gpu:latest'

timeout: '2400s'

options:
  logging: CLOUD_LOGGING_ONLY
