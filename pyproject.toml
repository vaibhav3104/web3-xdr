# ============================================================================
# Web3 XDR - Project Configuration
# ============================================================================

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

# Exclude tests and alembic from strict checking
exclude = [
    "^tests/",
    "^alembic/",
]

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "web3.*",
    "solana.*",
    "anchorpy.*",
    "neo4j.*",
    "redis.*",
    "structlog.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "sklearn.*",
    "xgboost.*",
    "onnx.*",
    "onnxruntime.*",
    "google.*",
    "anthropic.*",
    "reportlab.*",
    "imblearn.*",
    "locust.*",
    "telegram.*",
    "slack_sdk.*",
]
ignore_missing_imports = true
