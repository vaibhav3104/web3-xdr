name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "postgresql+asyncpg://sentinel3:sentinel3@localhost:5432/sentinel3_test"
  REDIS_URL: "redis://localhost:6379/0"
  ENVIRONMENT: "test"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ --output-format=github

      - name: Ruff format check
        run: ruff format --check src/
        continue-on-error: true  # Advisory until codebase is formatted

  validate-rules:
    name: Validate YAML Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate rules
        run: python scripts/validate_rules.py

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sentinel3
          POSTGRES_PASSWORD: sentinel3
          POSTGRES_DB: sentinel3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -x \
            --timeout=60 \
            -p no:anchorpy

      - name: Run exploit detection tests
        run: |
          python -m pytest tests/test_exploit_detection.py \
            -v \
            --tb=short \
            -x \
            --timeout=120 \
            -p no:anchorpy

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, validate-rules]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: sentinel3:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — API starts
        run: |
          docker run -d --name smoke-api \
            -e PROC_TYPE=api \
            -e DATABASE_URL=sqlite+aiosqlite:///tmp/test.db \
            -e REDIS_URL="" \
            -p 8080:8080 \
            sentinel3:${{ github.sha }}
          echo "Waiting for API to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health | grep -q healthy; then
              echo "Health check passed on attempt $i"
              docker stop smoke-api
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 30s"
          docker logs smoke-api
          docker stop smoke-api
          exit 1
