# Sentinel3 - CI/CD Pipeline with Bundled Frontend
# =============================================================================
# Staging: Push to 'develop' branch → deploys to web3-xdr (staging)
# Production: Push to 'main' branch → deploys to web3-xdr-production
# 
# Features:
# - Multi-stage build includes Runtime Security Plane with Python worker
# - Redis Memorystore integration via VPC connector
# - Cloud SQL Proxy for PostgreSQL
# =============================================================================

name: Deploy Sentinel3

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  GCP_REGION: us-central1
  GCP_PROJECT: web3-xdr

jobs:
  # ===========================================================================
  # Test (Python + Frontend Build Verification)
  # ===========================================================================
  test:
    name: Run Tests & Verify Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate Python imports (fail fast)
        run: |
          python -c "from src.api.server import create_app; print('✅ Server imports OK')"
          python -c "from src.query.lucene_parser import execute_lucene_query; print('✅ Query parser OK')"
      
      
      - name: Run Python tests
        run: |
          python -m pytest tests/ -v -p no:anchorpy --tb=short

      - name: Lint security checks
        run: |
          pip install bandit
          bandit -r src/ -ll --exclude src/ai/training -q || true

      - name: Verify Dockerfile
        run: |
          docker build --check . 2>/dev/null || echo "Dockerfile syntax OK"

  # ===========================================================================
  # Deploy to Staging (develop branch)
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      
      - name: "Build Docker image with frontend"
        run: |
          echo " Building multi-stage Docker image ()..."
          docker build \
            --no-cache \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging-${{ github.sha }} .
          docker tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging-${{ github.sha }} \
                     ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging
          echo " Docker image built "
      
      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging-${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging
      
      - name: Deploy API Service to Staging
        run: |
          # Retry logic to handle concurrent deployment conflicts
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if gcloud run deploy web3-xdr-api \
              --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging-${{ github.sha }} \
              --region ${{ env.GCP_REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              --memory 2Gi \
              --cpu 2 \
              --min-instances 1 \
              --max-instances 5 \
              --vpc-connector sentinel3-vpc \
              --vpc-egress private-ranges-only \
              --remove-cloudsql-instances web3-xdr:us-central1:web3-xdr-db \
              --set-env-vars "ENVIRONMENT=staging,GCP_PROJECT=${{ env.GCP_PROJECT }},PROC_TYPE=api,API_PORT=8080,REDIS_ENABLED=true,REDIS_URL=redis://10.74.131.163:6379/0,LAST_DEPLOY=$(date +%s)" \
              --set-secrets "INFURA_API_KEY=web3-xdr-infura-api-key:latest,JWT_SECRET_KEY=web3-xdr-jwt-secret:latest,OPENAI_API_KEY=web3-xdr-openai-api-key:latest,DATABASE_URL=web3-xdr-database-url:latest"; then
              echo "✅ API deployed successfully"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Deployment conflict, retrying in 10 seconds... (attempt $retry_count/$max_retries)"
                sleep 10
              else
                echo "❌ Deployment failed after $max_retries attempts"
                exit 1
              fi
            fi
          done

      - name: "Deploy Worker Service to Staging with UI"
        run: |
          # Retry logic to handle concurrent deployment conflicts
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if gcloud run deploy web3-xdr-worker \
              --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:staging-${{ github.sha }} \
              --region ${{ env.GCP_REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 9090 \
              --memory 4Gi \
              --cpu 2 \
              --min-instances 1 \
              --max-instances 3 \
              --timeout 300 \
              --cpu-boost \
              --vpc-connector sentinel3-vpc \
              --vpc-egress private-ranges-only \
              --remove-cloudsql-instances web3-xdr:us-central1:web3-xdr-db \
              --set-env-vars "ENVIRONMENT=staging,GCP_PROJECT=${{ env.GCP_PROJECT }},PROC_TYPE=worker,WORKER_HEALTH_PORT=9090,RUNTIME_ENABLED=true,MEMPOOL_SOURCE=pseudo,AUTO_START_SCANNER=true,SCANNER_CHAINS=ethereum:polygon:arbitrum:base:optimism:avalanche:bsc,REDIS_ENABLED=true,REDIS_URL=redis://10.74.131.163:6379/0,LAST_DEPLOY=$(date +%s)" \
              --set-secrets "INFURA_API_KEY=web3-xdr-infura-api-key:latest,JWT_SECRET_KEY=web3-xdr-jwt-secret:latest,OPENAI_API_KEY=web3-xdr-openai-api-key:latest,DATABASE_URL=web3-xdr-database-url:latest"; then
              echo "✅ Worker deployed successfully"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Deployment conflict, retrying in 10 seconds... (attempt $retry_count/$max_retries)"
                sleep 10
              else
                echo "❌ Deployment failed after $max_retries attempts"
                exit 1
              fi
            fi
          done
      
      - name: Get Staging URLs
        run: |
          API_URL=$(gcloud run services describe web3-xdr-api \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          WORKER_URL=$(gcloud run services describe web3-xdr-worker \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "## 🟡 Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Worker URL (with UI):** $WORKER_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Service:** $WORKER_URL/" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** $WORKER_URL/health" >> $GITHUB_STEP_SUMMARY
          echo "**Metrics:** $WORKER_URL/metrics" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`staging-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " **Frontend:** Runtime Security Plane and deployed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy to Production (main branch)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      
      - name: "Build Docker image with frontend"
        run: |
          echo " Building multi-stage Docker image ()..."
          docker build \
            --no-cache \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:${{ github.sha }} .
          docker tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:${{ github.sha }} \
                     ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:latest
          echo " Docker image built "
      
      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:latest
      
      - name: Deploy API Service to Production
        run: |
          # Retry logic to handle concurrent deployment conflicts
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if gcloud run deploy web3-xdr-production-api \
              --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:${{ github.sha }} \
              --region ${{ env.GCP_REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              --memory 2Gi \
              --cpu 2 \
              --min-instances 1 \
              --max-instances 10 \
              --vpc-connector sentinel3-vpc \
              --vpc-egress private-ranges-only \
              --remove-cloudsql-instances web3-xdr:us-central1:web3-xdr-db \
              --set-env-vars "^@^ENVIRONMENT=production@GCP_PROJECT=${{ env.GCP_PROJECT }}@PROC_TYPE=api@API_PORT=8080@REDIS_ENABLED=true@REDIS_URL=redis://10.74.131.163:6379/0@CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS || '*' }}@LAST_DEPLOY=$(date +%s)" \
              --set-secrets "INFURA_API_KEY=web3-xdr-infura-api-key:latest,JWT_SECRET_KEY=web3-xdr-jwt-secret:latest,OPENAI_API_KEY=web3-xdr-openai-api-key:latest,DATABASE_URL=web3-xdr-database-url:latest,XDR_USER_ADMIN=web3-xdr-admin-user:latest"; then
              echo "✅ API deployed successfully"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Deployment conflict, retrying in 10 seconds... (attempt $retry_count/$max_retries)"
                sleep 10
              else
                echo "❌ Deployment failed after $max_retries attempts"
                exit 1
              fi
            fi
          done

      - name: "Deploy Worker Service to Production with UI"
        run: |
          # Retry logic to handle concurrent deployment conflicts
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if gcloud run deploy web3-xdr-production-worker \
              --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/web3-xdr-repo/web3-xdr:${{ github.sha }} \
              --region ${{ env.GCP_REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 9090 \
              --memory 4Gi \
              --cpu 2 \
              --min-instances 1 \
              --max-instances 3 \
              --timeout 300 \
              --cpu-boost \
              --vpc-connector sentinel3-vpc \
              --vpc-egress private-ranges-only \
              --remove-cloudsql-instances web3-xdr:us-central1:web3-xdr-db \
              --set-env-vars "ENVIRONMENT=production,GCP_PROJECT=${{ env.GCP_PROJECT }},PROC_TYPE=worker,WORKER_HEALTH_PORT=9090,RUNTIME_ENABLED=true,MEMPOOL_SOURCE=pseudo,AUTO_START_SCANNER=true,SCANNER_CHAINS=ethereum:polygon:arbitrum:base:optimism:avalanche:bsc,REDIS_ENABLED=true,REDIS_URL=redis://10.74.131.163:6379/0,LAST_DEPLOY=$(date +%s)" \
              --set-secrets "INFURA_API_KEY=web3-xdr-infura-api-key:latest,JWT_SECRET_KEY=web3-xdr-jwt-secret:latest,OPENAI_API_KEY=web3-xdr-openai-api-key:latest,DATABASE_URL=web3-xdr-database-url:latest"; then
              echo "✅ Worker deployed successfully"
              break
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "⚠️ Deployment conflict, retrying in 10 seconds... (attempt $retry_count/$max_retries)"
                sleep 10
              else
                echo "❌ Deployment failed after $max_retries attempts"
                exit 1
              fi
            fi
          done
      
      - name: Get Production URLs
        run: |
          API_URL=$(gcloud run services describe web3-xdr-production-api \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          WORKER_URL=$(gcloud run services describe web3-xdr-production-worker \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "## 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Worker URL (with UI):** $WORKER_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Worker Service:** $WORKER_URL/" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** $WORKER_URL/health" >> $GITHUB_STEP_SUMMARY
          echo "**Metrics:** $WORKER_URL/metrics" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " **Frontend:** Runtime Security Plane and deployed" >> $GITHUB_STEP_SUMMARY