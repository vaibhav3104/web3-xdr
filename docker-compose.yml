# ============================================================================
# Sentinel3 - Docker Compose Configuration (with PostgreSQL)
# ============================================================================
#
# Usage:
#   Start all services:     docker-compose up -d
#   View logs:              docker-compose logs -f
#   Stop all:               docker-compose down
#   Reset database:         docker-compose down -v && docker-compose up -d
#
#   With monitoring:        docker-compose --profile monitoring up -d
#
# ============================================================================



services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database (Required for persistence)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sentinel3-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xdr_password}
      POSTGRES_DB: ${POSTGRES_DB:-web3_xdr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - xdr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xdr} -d ${POSTGRES_DB:-web3_xdr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # API Server (FastAPI Dashboard & Control Plane)
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel3-api
    ports:
      - "8080:8080"
    volumes:
      # Mount config for easy editing without rebuild
      - ./config:/app/config:ro
      # Mount rules for hot-reloading
      - ./config/rules:/app/config/rules
    environment:
      # Process type
      - PROC_TYPE=api
      - HEALTH_PORT=8080
      # Database
      - POSTGRES_ENABLED=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-xdr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xdr_password}
      - POSTGRES_DB=${POSTGRES_DB:-web3_xdr}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - DB_BATCH_SIZE=100
      # Redis (for shared state with worker)
      - REDIS_URL=redis://redis:6379/0
      # RPC Endpoints (override in .env file)
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL:-}
      # Alerting
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # App settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://xdr:xdr_password@postgres:5432/web3_xdr
      - ADMIN_API_KEY=${ADMIN_API_KEY:-sentinel3-dev-admin-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - xdr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Redis (for caching, state sharing, and real-time pub/sub)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinel3-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - xdr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Worker - Dedicated Blockchain Listener Process
  # --------------------------------------------------------------------------
  # Runs separately from the API server for better scaling and isolation.
  # Uses Redis for shared state with the main API.
  #
  # Scale workers: docker-compose up -d --scale worker=3
  # Run specific chains: Add WORKER_CHAINS=ethereum,polygon to environment
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel3-worker
    ports:
      - "9091:9090"
    environment:
      # Process type
      - PROC_TYPE=worker
      - HEALTH_PORT=9090
      # Redis for shared state (REQUIRED for production)
      - REDIS_URL=redis://redis:6379/0
      # Database
      - POSTGRES_ENABLED=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-xdr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xdr_password}
      - POSTGRES_DB=${POSTGRES_DB:-web3_xdr}
      - DATABASE_URL=postgresql://xdr:xdr_password@postgres:5432/web3_xdr
      # Worker settings
      - WORKER_HEALTH_PORT=9090
      - POLL_INTERVAL_SECONDS=2.0
      - BATCH_SIZE=10
      - PROCESSING_TIMEOUT_SECONDS=5.0
      # Optional: Filter specific chains (comma-separated)
      # - WORKER_CHAINS=ethereum,polygon,arbitrum
      # RPC Endpoints (override in .env file)
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL:-}
      # Alerting
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Features
      - GRAPH_ENABLED=${GRAPH_ENABLED:-true}
      - ML_DETECTION_ENABLED=${ML_DETECTION_ENABLED:-true}
      - CONTINUOUS_LEARNING_ENABLED=${CONTINUOUS_LEARNING_ENABLED:-true}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - xdr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # pgAdmin (Database Management UI)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel3-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@xdr.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - xdr-network
    profiles:
      - admin

  # --------------------------------------------------------------------------
  # Database Backup (Automated daily backups)
  # --------------------------------------------------------------------------
  db-backup:
    image: postgres:15-alpine
    container_name: sentinel3-db-backup
    entrypoint: sh -c "while true; do /backup.sh; sleep 86400; done"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-xdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xdr_password}
      POSTGRES_DB: ${POSTGRES_DB:-web3_xdr}
    volumes:
      - ./scripts/backup-db.sh:/backup.sh:ro
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xdr-network
    profiles:
      - admin

  # --------------------------------------------------------------------------
  # Prometheus (Metrics)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - xdr-network
    profiles:
      - monitoring

  # --------------------------------------------------------------------------
  # Grafana (Dashboards)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel3-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=${POSTGRES_DB:-web3_xdr}
      - GF_DATABASE_USER=${POSTGRES_USER:-xdr}
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-xdr_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - postgres
      - prometheus
    restart: unless-stopped
    networks:
      - xdr-network
    profiles:
      - monitoring

# Networks
networks:
  xdr-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Volumes (persistent data)
volumes:
  postgres-data:
    name: sentinel3-postgres-data
  redis-data:
    name: sentinel3-redis-data
  pgadmin-data:
    name: sentinel3-pgadmin-data
  prometheus-data:
    name: sentinel3-prometheus-data
  grafana-data:
    name: sentinel3-grafana-data
  backup-data:
    name: sentinel3-backup-data
