<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel3 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a24;
            --border: #2d2d3d;
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }
        
        * {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }
        
        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            animation: glow-pulse 8s ease-in-out infinite;
        }
        
        .bg-glow-1 {
            background: #8b5cf6;
            top: -200px;
            right: -200px;
        }
        
        .bg-glow-2 {
            background: #06b6d4;
            bottom: -200px;
            left: -200px;
            animation-delay: 4s;
        }
        
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.1); }
        }
        
        .login-card {
            background: rgba(18, 18, 26, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            box-shadow: 
                0 0 0 1px rgba(139, 92, 246, 0.1),
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 24px 24px 0 0;
        }
        
        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: logo-float 6s ease-in-out infinite;
        }
        
        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .logo-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            z-index: -1;
            filter: blur(15px);
            opacity: 0.5;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            padding-left: 48px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        
        .input-group input::placeholder {
            color: #4a4a5c;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 42px;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.5);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-btn .btn-loader {
            display: none;
        }
        
        .login-btn.loading .btn-text {
            visibility: hidden;
        }
        
        .login-btn.loading .btn-loader {
            display: block;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease;
        }
        
        .error-message.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .demo-credentials {
            margin-top: 24px;
            padding: 16px;
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.1);
            border-radius: 12px;
        }
        
        .demo-credentials h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        
        .demo-cred {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .demo-cred:last-child {
            border-bottom: none;
        }
        
        .demo-cred:hover {
            color: var(--accent);
        }
        
        .demo-cred .role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 4px;
        }
        
        /* Spinner animation */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .footer-links a:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <!-- Login Card -->
    <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
        </div>
        
        <!-- Title -->
        <h1 style="text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px;">
            Sentinel3
        </h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 32px;">
            Secure Admin Console
        </p>
        
        <!-- Error Message -->
        <div id="error-message" class="error-message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="error-text">Invalid credentials</span>
        </div>
        
        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter username" 
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter password" 
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="login-btn" id="login-btn">
                <span class="btn-text">Sign In</span>
                <div class="btn-loader">
                    <div class="spinner"></div>
                </div>
            </button>
        </form>
        
        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <h4>🔐 Demo Credentials</h4>
            <div class="demo-cred" onclick="fillCredentials('admin', 'admin123')">
                <span>admin / admin123</span>
                <span class="role">ADMIN</span>
            </div>
            <div class="demo-cred" onclick="fillCredentials('operator', 'operator123')">
                <span>operator / operator123</span>
                <span class="role">OPERATOR</span>
            </div>
            <div class="demo-cred" onclick="fillCredentials('viewer', 'viewer123')">
                <span>viewer / viewer123</span>
                <span class="role">VIEWER</span>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer-links">
            <a href="/frontend/index.html">← Back to Dashboard</a>
        </div>
    </div>
    
    <script>
        // Check if already logged in
        const token = localStorage.getItem('xdr_token');
        if (token) {
            // Verify token is still valid
            fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (res.ok) {
                    window.location.href = '/frontend/admin.html';
                } else {
                    localStorage.removeItem('xdr_token');
                    localStorage.removeItem('xdr_user');
                }
            })
            .catch(() => {
                localStorage.removeItem('xdr_token');
                localStorage.removeItem('xdr_user');
            });
        }
        
        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const errorEl = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            // Hide error
            errorEl.classList.remove('show');
            
            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('xdr_token', data.access_token);
                    localStorage.setItem('xdr_user', JSON.stringify(data.user));
                    
                    // Redirect to admin console
                    window.location.href = '/frontend/admin.html';
                } else {
                    // Show error
                    errorText.textContent = data.detail || 'Invalid credentials';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                errorText.textContent = 'Connection error. Please try again.';
                errorEl.classList.add('show');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }
        
        // Focus username on load
        document.getElementById('username').focus();
    </script>
</body>
</html>
