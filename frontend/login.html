<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/theme.css">
    <style>html,body{background:#030305!important;color:#f1f5f9;margin:0}body{opacity:1!important}</style>
    <title>Sentinel3 — Sign In</title>
    <script src="/frontend/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #030305;
            --card: rgba(10, 11, 16, 0.85);
            --input-bg: rgba(17, 18, 25, 0.9);
            --border: rgba(255,255,255,0.06);
            --border-focus: rgba(139, 92, 246, 0.5);
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --cyan: #22d3ee;
            --text: #f1f5f9;
            --text-2: #94a3b8;
            --text-3: #475569;
            --danger: #f43f5e;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Ambient Background ── */
        .bg-mesh {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 700px 700px at 20% 30%, rgba(139,92,246,0.1) 0%, transparent 100%),
                radial-gradient(ellipse 500px 500px at 80% 70%, rgba(34,211,238,0.07) 0%, transparent 100%),
                radial-gradient(ellipse 600px 400px at 60% 10%, rgba(139,92,246,0.05) 0%, transparent 100%);
        }

        /* Dot grid */
        .bg-dots {
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(circle, rgba(139,92,246,0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black 30%, transparent 100%);
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            z-index: 0;
            animation: orb-float 12s ease-in-out infinite;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: var(--accent);
            top: 10%; left: 15%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: var(--cyan);
            bottom: 15%; right: 10%;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: #6d28d9;
            top: 60%; left: 60%;
            animation-delay: -8s;
        }
        @keyframes orb-float {
            0%, 100% { opacity: 0.06; transform: translate(0, 0) scale(1); }
            33%      { opacity: 0.1;  transform: translate(30px, -20px) scale(1.1); }
            66%      { opacity: 0.07; transform: translate(-20px, 15px) scale(0.95); }
        }

        /* Horizontal scan lines */
        .scanlines {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(139,92,246,0.01) 3px,
                rgba(139,92,246,0.01) 4px
            );
        }

        /* ── Login Card ── */
        .login-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 440px;
            padding: 48px 40px;
            background: var(--card);
            backdrop-filter: blur(40px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow:
                0 0 0 1px rgba(139,92,246,0.08),
                0 32px 64px -16px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        /* Animated top border gradient */
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), var(--accent), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
            border-radius: 2px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        .logo-mark {
            width: 72px; height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 50%, #4f46e5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow:
                0 0 40px rgba(139,92,246,0.3),
                0 0 80px rgba(139,92,246,0.1);
            animation: logo-breathe 4s ease-in-out infinite;
        }
        @keyframes logo-breathe {
            0%, 100% { box-shadow: 0 0 40px rgba(139,92,246,0.25), 0 0 80px rgba(139,92,246,0.08); }
            50%      { box-shadow: 0 0 60px rgba(139,92,246,0.35), 0 0 100px rgba(139,92,246,0.15); }
        }
        .logo-mark svg { width: 36px; height: 36px; color: #fff; }

        /* Scan ring around logo */
        .logo-mark::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 22px;
            border: 1.5px solid transparent;
            border-top-color: var(--accent-light);
            animation: logo-spin 3s linear infinite;
        }
        @keyframes logo-spin {
            to { transform: rotate(360deg); }
        }

        /* ── Typography ── */
        .title {
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            margin-bottom: 36px;
            letter-spacing: 0.02em;
        }

        /* ── Form ── */
        .field {
            position: relative;
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .field-inner {
            position: relative;
        }
        .field-icon {
            position: absolute;
            left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px;
            color: var(--text-3);
            pointer-events: none;
            transition: color 0.3s;
        }
        .field input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }
        .field input::placeholder { color: rgba(148,163,184,0.3); }
        .field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.1), 0 0 20px rgba(139,92,246,0.05);
        }
        .field input:focus + .field-icon,
        .field input:focus ~ .field-icon { color: var(--accent-light); }

        /* ── Button ── */
        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            transition: all 0.3s;
            margin-top: 4px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(139,92,246,0.5);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Button shimmer effect */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                115deg,
                transparent 20%,
                rgba(255,255,255,0.1) 40%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0.1) 60%,
                transparent 80%
            );
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .btn-primary:hover::after { transform: translateX(30%); }

        .btn-text { position: relative; z-index: 1; }
        .btn-loader {
            display: none;
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .btn-primary.loading .btn-text { visibility: hidden; }
        .btn-primary.loading .btn-loader { display: block; }
        .btn-primary.loading::after { display: none; }

        .spinner {
            width: 22px; height: 22px;
            border: 2.5px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error ── */
        .error-msg {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: rgba(244, 63, 94, 0.08);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: var(--danger);
            font-size: 13px;
            animation: shake 0.4s ease;
        }
        .error-msg.show { display: flex; }
        .error-msg svg { flex-shrink: 0; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* ── Demo Credentials ── */
        .demo-box {
            margin-top: 28px;
            padding: 16px;
            background: rgba(139, 92, 246, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.08);
            border-radius: 14px;
        }
        .demo-box h4 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-3);
            margin-bottom: 10px;
        }
        .demo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 13px;
            color: var(--text-2);
        }
        .demo-row:last-child { border-bottom: none; }
        .demo-row:hover { color: var(--accent-light); }
        .demo-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 2px 8px;
            background: rgba(139, 92, 246, 0.15);
            border-radius: 6px;
            color: var(--accent-light);
            letter-spacing: 0.04em;
        }

        /* ── Footer ── */
        .login-footer {
            margin-top: 24px;
            text-align: center;
        }
        .login-footer a {
            font-size: 13px;
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-footer a:hover { color: var(--accent-light); }

        /* ── Version Badge ── */
        .version-badge {
            position: fixed;
            bottom: 20px; right: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-3);
            opacity: 0.5;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- Background layers -->
    <div class="bg-mesh"></div>
    <div class="bg-dots"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanlines"></div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="logo-wrap">
            <div class="logo-mark">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </div>
        </div>

        <h1 class="title">Sentinel3</h1>
        <p class="subtitle">Web3 Extended Detection & Response</p>

        <!-- Error -->
        <div id="error-message" class="error-msg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="error-text">Invalid credentials</span>
        </div>

        <!-- Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="field">
                <label>Username</label>
                <div class="field-inner">
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="field">
                <label>Password</label>
                <div class="field-inner">
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="login-btn">
                <span class="btn-text">Sign In</span>
                <div class="btn-loader"><div class="spinner"></div></div>
            </button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-box" id="demo-creds" style="display:none;">
            <h4>Quick Access</h4>
            <div class="demo-row" onclick="fillCredentials('admin', 'admin123')">
                <span>admin / admin123</span>
                <span class="demo-badge">ADMIN</span>
            </div>
            <div class="demo-row" onclick="fillCredentials('operator', 'operator123')">
                <span>operator / operator123</span>
                <span class="demo-badge">OPERATOR</span>
            </div>
            <div class="demo-row" onclick="fillCredentials('viewer', 'viewer123')">
                <span>viewer / viewer123</span>
                <span class="demo-badge">VIEWER</span>
            </div>
        </div>

        <div class="login-footer">
            <a href="/">&larr; Back to Dashboard</a>
        </div>
    </div>

    <div class="version-badge">Sentinel3 v2.0</div>

    <script>
        // Redirect if already logged in
        const token = localStorage.getItem('xdr_token');
        if (token) {
            fetch((window.SENTINEL3_API_BASE || '') + '/api/auth/verify', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => { if (r.ok) window.location.href = '/'; else { localStorage.removeItem('xdr_token'); localStorage.removeItem('xdr_user'); } })
            .catch(() => { localStorage.removeItem('xdr_token'); localStorage.removeItem('xdr_user'); });
        }

        function fillCredentials(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('error-message');
            const errText = document.getElementById('error-text');

            errEl.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch((window.SENTINEL3_API_BASE || '') + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('xdr_token', data.access_token);
                    localStorage.setItem('xdr_user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    errText.textContent = data.detail || 'Invalid credentials';
                    errEl.classList.add('show');
                }
            } catch {
                errText.textContent = 'Connection error. Please try again.';
                errEl.classList.add('show');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Show demo credentials in non-production
        fetch((window.SENTINEL3_API_BASE || '') + '/health')
            .then(r => r.json())
            .then(d => { if (!d.environment || d.environment !== 'production') document.getElementById('demo-creds').style.display = ''; })
            .catch(() => { document.getElementById('demo-creds').style.display = ''; });

        document.getElementById('username').focus();
    </script>
</body>
</html>
