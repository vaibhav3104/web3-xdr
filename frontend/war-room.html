<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War Room - Sentinel3</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/war-room-embed.css">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a1f2e;
            --bg-hover: #252b3d;
            --bg-input: #0f1419;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --border-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-cyan);
        }

        /* War Room Container */
        .war-room-full-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .war-room-header-full {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .war-room-header-full h1 {
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
        }

        .war-room-controls-full {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        #war-room-frame-full {
            flex: 1;
            width: 100%;
            border: 2px solid var(--accent-green);
            border-radius: 8px;
            background: #000;
            min-height: 600px;
        }

        .war-room-loading-full {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--accent-green);
        }

        .war-room-error-full {
            background: var(--bg-card);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            color: var(--text-primary);
            display: none;
        }

        .war-room-error-full.show {
            display: block;
        }

        @media (max-width: 768px) {
            .nav {
                padding: 1rem;
                flex-wrap: wrap;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.85rem;
            }

            .war-room-full-page {
                padding: 1rem;
            }

            .war-room-header-full {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .war-room-controls-full {
                width: 100%;
            }

            .war-room-controls-full .war-room-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <span>🛡️</span>
            <span>Sentinel3 XDR</span>
        </a>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="logs.html">Log Explorer</a>
            <a href="war-room.html" class="active">War Room</a>
            <a href="admin.html">Rules</a>
            <a href="guardian.html">Guardian</a>
            <a href="analytics.html">Analytics</a>
        </div>
    </nav>

    <div class="war-room-full-page">
        <div class="war-room-header-full">
            <h1>🎯 War Room - Real-Time Threat Monitoring</h1>
            <div class="war-room-controls-full">
                <button id="war-room-reload-full" class="war-room-btn">Reload</button>
                <button id="war-room-fullscreen-full" class="war-room-btn primary">Fullscreen</button>
                <a href="logs.html" class="war-room-link">← Back to Logs</a>
                <a href="https://web3-xdr-production-worker-ipje7qz66q-uc.a.run.app/" target="_blank" class="war-room-link">Open in New Tab ↗</a>
            </div>
        </div>

        <div style="position: relative; flex: 1; min-height: 600px;">
            <div class="war-room-loading-full" id="war-room-loading-full">
                <div class="war-room-spinner"></div>
                <p>Loading War Room...</p>
            </div>

            <div class="war-room-error-full" id="war-room-error-full">
                <div class="error-icon" style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                <p style="margin-bottom: 1rem; color: var(--text-secondary);">
                    War Room failed to load. This may be due to security restrictions.
                </p>
                <div class="war-room-controls-full" style="justify-content: center;">
                    <button class="war-room-btn primary" onclick="retryLoadFull()">Retry</button>
                    <a href="https://web3-xdr-production-worker-ipje7qz66q-uc.a.run.app/" target="_blank" class="war-room-link">Open in New Tab ↗</a>
                </div>
            </div>

            <iframe 
                id="war-room-frame-full"
                src="https://web3-xdr-production-worker-ipje7qz66q-uc.a.run.app/"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const WAR_ROOM_URL = "https://web3-xdr-production-worker-ipje7qz66q-uc.a.run.app/";
            const LOAD_TIMEOUT = 10000;
            let loadTimeoutId = null;
            let isFullscreen = false;

            const iframe = document.getElementById('war-room-frame-full');
            const loadingDiv = document.getElementById('war-room-loading-full');
            const errorDiv = document.getElementById('war-room-error-full');
            const reloadBtn = document.getElementById('war-room-reload-full');
            const fullscreenBtn = document.getElementById('war-room-fullscreen-full');

            function hideLoading() {
                loadingDiv.style.display = 'none';
            }

            function showError() {
                hideLoading();
                errorDiv.classList.add('show');
                iframe.style.display = 'none';
            }

            function hideError() {
                errorDiv.classList.remove('show');
                iframe.style.display = 'block';
            }

            function handleLoad() {
                hideError();
                loadingDiv.style.display = 'block';
                
                loadTimeoutId = setTimeout(function() {
                    if (loadingDiv.style.display !== 'none') {
                        showError();
                    }
                }, LOAD_TIMEOUT);
            }

            function handleLoadComplete() {
                hideLoading();
                if (loadTimeoutId) {
                    clearTimeout(loadTimeoutId);
                }
            }

            function handleLoadError() {
                showError();
            }

            function retryLoad() {
                hideError();
                iframe.src = '';
                setTimeout(function() {
                    iframe.src = WAR_ROOM_URL;
                    handleLoad();
                }, 100);
            }

            function handleReload() {
                retryLoad();
            }

            function handleFullscreen() {
                const container = iframe.parentElement.parentElement;
                
                if (isFullscreen) {
                    exitFullscreen();
                } else {
                    enterFullscreen(container);
                }
            }

            function enterFullscreen(element) {
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                } else {
                    // Fallback overlay
                    element.classList.add('war-room-overlay');
                    document.body.style.overflow = 'hidden';
                    isFullscreen = true;
                    updateFullscreenButton();
                }
            }

            function exitFullscreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else {
                    const container = document.querySelector('.war-room-overlay');
                    if (container) {
                        container.classList.remove('war-room-overlay');
                        document.body.style.overflow = '';
                    }
                    isFullscreen = false;
                    updateFullscreenButton();
                }
            }

            function handleFullscreenChange() {
                const isCurrentlyFullscreen = !!(
                    document.fullscreenElement ||
                    document.webkitFullscreenElement ||
                    document.mozFullScreenElement ||
                    document.msFullscreenElement
                );

                isFullscreen = isCurrentlyFullscreen;
                updateFullscreenButton();
            }

            function updateFullscreenButton() {
                if (fullscreenBtn) {
                    fullscreenBtn.textContent = isFullscreen ? 'Exit Fullscreen' : 'Fullscreen';
                }
            }

            // Event listeners
            iframe.addEventListener('load', handleLoadComplete, { once: true });
            iframe.addEventListener('error', handleLoadError, { once: true });
            
            if (reloadBtn) {
                reloadBtn.addEventListener('click', handleReload);
            }
            
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', handleFullscreen);
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isFullscreen) {
                    exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);

            // Initial load
            handleLoad();

            // Public API
            window.retryLoadFull = retryLoad;
        })();
    </script>
</body>
</html>
