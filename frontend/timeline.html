<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/theme.css">
    <style>html,body{background:#030305!important;color:#f1f5f9;margin:0}</style>
    <title>Timeline Replay - Sentinel3</title>
    <script src="/frontend/config.js"></script>
    <script src="/frontend/nav.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--s3-bg-0);
            color: var(--s3-text);
            margin: 0;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        /* ── Glass Card ───────────────────────────────────── */
        .glass {
            background: var(--s3-glass);
            backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--s3-border);
            border-radius: var(--s3-radius);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .glass:hover { border-color: rgba(255,255,255,0.1); }

        /* ── Header ───────────────────────────────────────── */
        .s3-header {
            position: sticky; top: 0; z-index: 30;
            background: rgba(3,3,5,0.6);
            backdrop-filter: blur(20px) saturate(1.3);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 14px 28px;
        }
        .s3-header::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,92,246,0.2), rgba(34,211,238,0.15), transparent);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-left {
            display: flex; align-items: center; gap: 16px;
        }
        .header-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px; font-weight: 600;
            background: linear-gradient(135deg, var(--s3-accent-light), var(--s3-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── Page Layout ──────────────────────────────────── */
        .page-content {
            flex: 1; min-width: 0;
            padding: 24px 28px;
            overflow-y: auto;
        }

        /* ── Buttons ──────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px;
            border-radius: var(--s3-radius-sm);
            font-size: 13px; font-weight: 500;
            border: none; cursor: pointer;
            transition: all 0.2s;
            color: var(--s3-text);
            white-space: nowrap;
        }
        .btn-accent { background: var(--s3-accent); }
        .btn-accent:hover { background: #7c4fe0; }
        .btn-ghost {
            background: var(--s3-bg-3);
            border: 1px solid var(--s3-border);
        }
        .btn-ghost:hover { background: var(--s3-bg-4); border-color: rgba(255,255,255,0.1); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

        /* ── Severity Badges ──────────────────────────────── */
        .sev-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.04em; text-transform: uppercase;
        }
        .sev-badge.critical { background: rgba(244,63,94,0.12); color: #fb7185; border: 1px solid rgba(244,63,94,0.2); }
        .sev-badge.high     { background: rgba(249,115,22,0.12); color: #fb923c; border: 1px solid rgba(249,115,22,0.2); }
        .sev-badge.medium   { background: rgba(234,179,8,0.12);  color: #facc15; border: 1px solid rgba(234,179,8,0.2); }
        .sev-badge.low      { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .sev-badge.info     { background: rgba(100,116,139,0.12); color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }
        .sev-dot {
            width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        }
        .sev-dot.critical { background: var(--s3-critical); box-shadow: 0 0 8px rgba(244,63,94,0.5); }
        .sev-dot.high     { background: var(--s3-high); box-shadow: 0 0 8px rgba(249,115,22,0.4); }
        .sev-dot.medium   { background: var(--s3-medium); }
        .sev-dot.low      { background: var(--s3-low); }
        .sev-dot.info     { background: #64748b; }

        /* ── Incident Header ──────────────────────────────── */
        .incident-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 24px; flex-wrap: wrap;
        }
        .incident-meta {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .meta-tag {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 500;
            background: var(--s3-bg-3); color: var(--s3-text-2);
            border: 1px solid var(--s3-border);
        }
        .loss-tag {
            background: rgba(244,63,94,0.08); color: #fb7185;
            border-color: rgba(244,63,94,0.15);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 13px;
        }

        /* ── Playback Controls ────────────────────────────── */
        .playback-bar {
            display: flex; align-items: center; gap: 16px;
            padding: 14px 20px;
        }
        .play-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--s3-accent);
            border: none;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .play-btn:hover { background: #7c4fe0; transform: scale(1.05); }
        .play-btn:active { transform: scale(0.95); }
        .play-btn.playing { background: var(--s3-high); }

        .step-btn {
            width: 28px; height: 28px;
            border-radius: 6px;
            background: var(--s3-bg-3);
            border: 1px solid var(--s3-border);
            color: var(--s3-text-2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .step-btn:hover { background: var(--s3-bg-4); color: var(--s3-text); }

        .progress-track-lg {
            flex: 1; height: 6px;
            background: var(--s3-bg-3);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .progress-fill-lg {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--s3-accent), var(--s3-cyan));
            transition: width 0.3s ease;
        }
        .progress-track-lg:hover .progress-fill-lg {
            filter: brightness(1.2);
        }

        .speed-control {
            display: flex; align-items: center; gap: 6px;
            flex-shrink: 0;
        }
        .speed-btn {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px; font-weight: 600;
            border: 1px solid var(--s3-border);
            background: var(--s3-bg-3);
            color: var(--s3-text-3);
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'JetBrains Mono', monospace;
        }
        .speed-btn:hover { background: var(--s3-bg-4); color: var(--s3-text-2); }
        .speed-btn.active {
            background: var(--s3-accent-dim);
            color: var(--s3-accent-light);
            border-color: rgba(139,92,246,0.3);
        }

        .playback-time {
            font-size: 11px; color: var(--s3-text-3);
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0; min-width: 60px; text-align: center;
        }

        /* ── Main Layout ──────────────────────────────────── */
        .timeline-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 1200px) {
            .timeline-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ── Swim Lane Container ──────────────────────────── */
        .swim-lanes {
            position: relative;
            overflow: hidden;
        }
        .swim-lanes-inner {
            display: flex;
            min-height: 500px;
            position: relative;
        }
        .lane-headers {
            display: flex;
            border-bottom: 1px solid var(--s3-border);
        }
        .lane-header {
            flex: 1;
            padding: 12px 16px;
            font-size: 12px; font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex; align-items: center; gap: 8px;
            border-right: 1px solid rgba(255,255,255,0.03);
        }
        .lane-header:last-child { border-right: none; }
        .lane-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }

        /* Chain colors */
        .chain-ethereum  { --chain-color: #3B82F6; --chain-bg: rgba(59,130,246,0.06); }
        .chain-polygon   { --chain-color: #8B5CF6; --chain-bg: rgba(139,92,246,0.06); }
        .chain-arbitrum   { --chain-color: #06B6D4; --chain-bg: rgba(6,182,212,0.06); }
        .chain-solana    { --chain-color: #10B981; --chain-bg: rgba(16,185,129,0.06); }
        .chain-bsc       { --chain-color: #F59E0B; --chain-bg: rgba(245,158,11,0.06); }
        .chain-avalanche { --chain-color: #EF4444; --chain-bg: rgba(239,68,68,0.06); }
        .chain-default   { --chain-color: #64748B; --chain-bg: rgba(100,116,139,0.06); }

        .lane {
            flex: 1;
            border-right: 1px solid rgba(255,255,255,0.03);
            position: relative;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            background: var(--chain-bg, transparent);
        }
        .lane:last-child { border-right: none; }

        /* ── Event Card in Lane ───────────────────────────── */
        .event-card {
            background: rgba(10,11,16,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--s3-border);
            border-left: 3px solid var(--chain-color, #64748b);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            transform: translateY(10px);
            position: relative;
        }
        .event-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .event-card.active {
            border-color: var(--chain-color, var(--s3-accent));
            box-shadow: 0 0 20px rgba(139,92,246,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .event-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }
        .event-card.violation {
            border-left-color: var(--s3-critical);
            box-shadow: 0 0 20px rgba(244,63,94,0.15);
        }
        .event-card.violation.visible {
            animation: violation-pulse 0.6s ease;
        }

        @keyframes violation-pulse {
            0% { box-shadow: 0 0 0 rgba(244,63,94,0); }
            50% { box-shadow: 0 0 30px rgba(244,63,94,0.3), 0 0 60px rgba(244,63,94,0.1); }
            100% { box-shadow: 0 0 20px rgba(244,63,94,0.15); }
        }

        .event-time {
            font-size: 10px; color: var(--s3-text-3);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 4px;
        }
        .event-title {
            font-size: 12px; font-weight: 500;
            color: var(--s3-text);
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .event-amount {
            font-size: 11px; color: var(--s3-text-2);
            font-family: 'JetBrains Mono', monospace;
        }
        .event-alert-icon {
            position: absolute; top: 8px; right: 8px;
            width: 18px; height: 18px;
            color: var(--s3-critical);
            animation: alert-blink 1.5s ease-in-out infinite;
        }
        @keyframes alert-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Cross-chain Arrow ────────────────────────────── */
        .cross-chain-arrow {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        .arrow-line {
            stroke: var(--s3-accent);
            stroke-width: 2;
            stroke-dasharray: 8 4;
            fill: none;
            animation: dash-flow 1s linear infinite;
        }
        .arrow-line.violation {
            stroke: var(--s3-critical);
        }
        @keyframes dash-flow {
            to { stroke-dashoffset: -12; }
        }
        .arrow-head {
            fill: var(--s3-accent);
        }
        .arrow-head.violation {
            fill: var(--s3-critical);
        }

        /* ── Playback Position Line ──────────────────────── */
        .playback-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--s3-cyan), var(--s3-accent), transparent);
            z-index: 10;
            transition: top 0.3s ease;
            pointer-events: none;
            opacity: 0;
        }
        .playback-line.active {
            opacity: 1;
        }
        .playback-line::before {
            content: '';
            position: absolute;
            left: -4px; top: -3px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--s3-cyan);
            box-shadow: 0 0 12px rgba(34,211,238,0.6);
        }

        /* ── Detail Panel ─────────────────────────────────── */
        .detail-panel {
            position: sticky; top: 100px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .detail-panel::-webkit-scrollbar { width: 4px; }
        .detail-panel::-webkit-scrollbar-thumb { background: var(--s3-bg-4); border-radius: 2px; }

        .detail-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--s3-border);
        }
        .detail-body {
            padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .detail-row {
            display: flex; flex-direction: column; gap: 4px;
        }
        .detail-label {
            font-size: 10px; font-weight: 600;
            color: var(--s3-text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .detail-value {
            font-size: 13px; color: var(--s3-text);
            word-break: break-all;
        }
        .detail-value a {
            color: var(--s3-cyan);
            text-decoration: none;
        }
        .detail-value a:hover {
            text-decoration: underline;
        }
        .violation-box {
            background: rgba(244,63,94,0.06);
            border: 1px solid rgba(244,63,94,0.15);
            border-radius: 10px;
            padding: 14px;
        }
        .violation-title {
            font-size: 12px; font-weight: 600;
            color: #fb7185;
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .violation-text {
            font-size: 12px; color: var(--s3-text-2);
            line-height: 1.5;
        }

        /* ── Bottom Summary ───────────────────────────────── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
        }
        .summary-stat {
            text-align: center;
            padding: 16px;
        }
        .summary-stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px; font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .summary-stat-label {
            font-size: 10px; color: var(--s3-text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
            margin-top: 6px;
        }

        .explanation-box {
            background: rgba(139,92,246,0.04);
            border: 1px solid rgba(139,92,246,0.1);
            border-radius: 10px;
            padding: 16px 20px;
        }
        .explanation-title {
            font-size: 13px; font-weight: 600;
            color: var(--s3-accent-light);
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .explanation-text {
            font-size: 13px; color: var(--s3-text-2);
            line-height: 1.6;
        }

        .recommendation-list {
            list-style: none; padding: 0; margin: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .recommendation-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 14px;
            background: rgba(16,185,129,0.04);
            border: 1px solid rgba(16,185,129,0.1);
            border-radius: 8px;
            font-size: 12px; color: var(--s3-text-2);
            line-height: 1.4;
        }
        .recommendation-icon {
            width: 16px; height: 16px;
            color: #34d399;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ── Screen Flash ─────────────────────────────────── */
        .screen-flash {
            position: fixed; inset: 0;
            background: rgba(244,63,94,0.08);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .screen-flash.active {
            opacity: 1;
        }

        /* ── Empty / Loading States ──────────────────────── */
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--s3-bg-4);
            border-top-color: var(--s3-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; padding: 60px 20px;
            color: var(--s3-text-3);
        }
        .empty-state svg {
            width: 48px; height: 48px; opacity: 0.4;
        }

        /* ── Back Link ────────────────────────────────────── */
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--s3-text-3);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--s3-accent-light); }
        .back-link svg { width: 14px; height: 14px; }

        /* ── Demo Badge ───────────────────────────────────── */
        .demo-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.04em; text-transform: uppercase;
            background: rgba(234,179,8,0.12); color: #facc15;
            border: 1px solid rgba(234,179,8,0.2);
        }
    </style>
</head>
<body>
<div id="app" x-data="timelineApp()" x-init="init()" x-cloak>
    <!-- Screen Flash overlay for violations -->
    <div class="screen-flash" :class="{'active': screenFlash}"></div>

    <!-- Header -->
    <div class="s3-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="/frontend/incidents.html" class="back-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Back to Incidents
                </a>
                <span class="header-title font-display" x-text="incident?.title || 'Timeline Replay'"></span>
                <span class="demo-badge" x-show="isDemo">Demo</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <template x-if="incident">
                    <div class="incident-meta">
                        <span class="sev-badge" :class="incident.severity">
                            <span class="sev-dot" :class="incident.severity"></span>
                            <span x-text="incident.severity?.toUpperCase()"></span>
                        </span>
                        <span class="meta-tag" x-text="formatAttackType(incident.attack_type)"></span>
                        <span class="meta-tag loss-tag" x-text="'$' + formatNumber(incident.total_loss_usd)"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Page Content -->
    <div class="page-content">
        <!-- Loading -->
        <template x-if="loading">
            <div class="empty-state">
                <div class="loading-spinner"></div>
                <span>Loading incident data...</span>
            </div>
        </template>

        <!-- Loaded Content -->
        <template x-if="!loading">
            <div>
                <!-- Playback Controls -->
                <div class="glass playback-bar">
                    <!-- Play/Pause -->
                    <button class="play-btn" :class="{'playing': isPlaying}" @click="togglePlay()" :title="isPlaying ? 'Pause' : 'Play'">
                        <svg x-show="!isPlaying" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg x-show="isPlaying" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
                    </button>

                    <!-- Step Back -->
                    <button class="step-btn" @click="stepBack()" title="Previous Event">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>

                    <!-- Step Forward -->
                    <button class="step-btn" @click="stepForward()" title="Next Event">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>

                    <!-- Progress Bar -->
                    <div class="progress-track-lg" @click="seekToPosition($event)">
                        <div class="progress-fill-lg" :style="`width: ${progressPercent}%`"></div>
                    </div>

                    <!-- Counter -->
                    <span class="playback-time" x-text="`${currentIndex + 1} / ${events.length}`"></span>

                    <!-- Speed Controls -->
                    <div class="speed-control">
                        <template x-for="s in speeds" :key="s">
                            <button class="speed-btn" :class="{'active': speed === s}" @click="setSpeed(s)" x-text="s + 'x'"></button>
                        </template>
                    </div>

                    <!-- Reset -->
                    <button class="step-btn" @click="reset()" title="Reset">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0115.6-5.2M20 15a9 9 0 01-15.6 5.2"/></svg>
                    </button>
                </div>

                <!-- Timeline Layout -->
                <div class="timeline-layout">
                    <!-- Left: Swim Lanes -->
                    <div class="glass swim-lanes" style="overflow: visible;">
                        <!-- Lane Headers -->
                        <div class="lane-headers">
                            <template x-for="chain in chains" :key="chain">
                                <div class="lane-header" :class="'chain-' + getChainClass(chain)">
                                    <span class="lane-dot" :style="`background: ${getChainColor(chain)}`"></span>
                                    <span x-text="chain"></span>
                                </div>
                            </template>
                        </div>

                        <!-- SVG Overlay for Arrows -->
                        <svg class="cross-chain-arrow" :style="`position:absolute;top:0;left:0;width:100%;height:${laneHeight}px;pointer-events:none;z-index:5;`"
                             :viewBox="`0 0 1000 ${laneHeight}`" preserveAspectRatio="none">
                            <defs>
                                <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                                    <path d="M0,0 L8,3 L0,6 Z" class="arrow-head"/>
                                </marker>
                                <marker id="arrowHeadViolation" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                                    <path d="M0,0 L8,3 L0,6 Z" class="arrow-head violation"/>
                                </marker>
                            </defs>
                            <template x-for="arrow in visibleArrows" :key="arrow.id">
                                <line :x1="arrow.x1" :y1="arrow.y1" :x2="arrow.x2" :y2="arrow.y2"
                                      :class="'arrow-line' + (arrow.violation ? ' violation' : '')"
                                      :marker-end="arrow.violation ? 'url(#arrowHeadViolation)' : 'url(#arrowHead)'"/>
                            </template>
                        </svg>

                        <!-- Playback Position Line -->
                        <div class="playback-line" :class="{'active': isPlaying || currentIndex > 0}"
                             :style="`top: ${playbackLineTop}px`"></div>

                        <!-- Lane Columns -->
                        <div class="swim-lanes-inner" :style="`min-height: ${laneHeight}px`">
                            <template x-for="chain in chains" :key="chain">
                                <div class="lane" :class="'chain-' + getChainClass(chain)">
                                    <template x-for="(evt, idx) in getEventsForChain(chain)" :key="evt.id">
                                        <div class="event-card"
                                             :class="{
                                                 'visible': evt._visible,
                                                 'active': selectedEvent?.id === evt.id,
                                                 'violation': evt.is_violation
                                             }"
                                             :style="`border-left-color: ${getChainColor(chain)}`"
                                             @click="selectEvent(evt)">
                                            <!-- Violation Alert Icon -->
                                            <template x-if="evt.is_violation">
                                                <svg class="event-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                                                </svg>
                                            </template>
                                            <div class="event-time" x-text="formatEventTime(evt.timestamp)"></div>
                                            <div class="event-title" x-text="evt.description"></div>
                                            <template x-if="evt.amount">
                                                <div class="event-amount" x-text="evt.amount"></div>
                                            </template>
                                            <template x-if="evt.is_violation">
                                                <div style="margin-top: 4px;">
                                                    <span class="sev-badge critical" style="font-size: 9px; padding: 2px 6px;">VIOLATION</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Right: Event Detail -->
                    <div class="detail-panel">
                        <!-- No Selection -->
                        <template x-if="!selectedEvent">
                            <div class="glass" style="padding: 40px 20px;">
                                <div class="empty-state" style="padding: 20px;">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 36px; height: 36px; opacity: 0.3;">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    <span style="font-size: 13px;">Click an event or press play to begin</span>
                                </div>
                            </div>
                        </template>

                        <!-- Selected Event Detail -->
                        <template x-if="selectedEvent">
                            <div class="glass">
                                <div class="detail-header">
                                    <div style="display: flex; align-items: center; justify-content: space-between;">
                                        <span style="font-size: 14px; font-weight: 600;" x-text="selectedEvent.description"></span>
                                        <span class="sev-badge" :class="selectedEvent.severity || 'info'">
                                            <span class="sev-dot" :class="selectedEvent.severity || 'info'"></span>
                                            <span x-text="(selectedEvent.severity || 'info').toUpperCase()"></span>
                                        </span>
                                    </div>
                                </div>
                                <div class="detail-body">
                                    <!-- Chain -->
                                    <div class="detail-row">
                                        <span class="detail-label">Chain</span>
                                        <span class="detail-value" style="display: flex; align-items: center; gap: 6px;">
                                            <span class="lane-dot" :style="`background: ${getChainColor(selectedEvent.chain)}; width: 6px; height: 6px; display: inline-block; border-radius: 50%;`"></span>
                                            <span x-text="selectedEvent.chain"></span>
                                        </span>
                                    </div>

                                    <!-- Timestamp -->
                                    <div class="detail-row">
                                        <span class="detail-label">Timestamp</span>
                                        <span class="detail-value font-mono" style="font-size: 12px;" x-text="new Date(selectedEvent.timestamp).toISOString()"></span>
                                    </div>

                                    <!-- Tx Hash -->
                                    <div class="detail-row" x-show="selectedEvent.tx_hash">
                                        <span class="detail-label">Transaction Hash</span>
                                        <span class="detail-value">
                                            <a :href="getExplorerUrl(selectedEvent.chain, selectedEvent.tx_hash)"
                                               target="_blank" class="font-mono" style="font-size: 11px;"
                                               x-text="selectedEvent.tx_hash"></a>
                                        </span>
                                    </div>

                                    <!-- From/To Addresses -->
                                    <template x-if="selectedEvent.from_address">
                                        <div class="detail-row">
                                            <span class="detail-label">From Address</span>
                                            <span class="detail-value font-mono" style="font-size: 11px;" x-text="selectedEvent.from_address"></span>
                                        </div>
                                    </template>
                                    <template x-if="selectedEvent.to_address">
                                        <div class="detail-row">
                                            <span class="detail-label">To Address</span>
                                            <span class="detail-value font-mono" style="font-size: 11px;" x-text="selectedEvent.to_address"></span>
                                        </div>
                                    </template>

                                    <!-- Amount -->
                                    <template x-if="selectedEvent.amount">
                                        <div class="detail-row">
                                            <span class="detail-label">Amount</span>
                                            <span class="detail-value font-display" style="font-size: 16px; font-weight: 700;" x-text="selectedEvent.amount"></span>
                                        </div>
                                    </template>

                                    <!-- Event Type -->
                                    <template x-if="selectedEvent.event_type">
                                        <div class="detail-row">
                                            <span class="detail-label">Event Type</span>
                                            <span class="detail-value" x-text="selectedEvent.event_type"></span>
                                        </div>
                                    </template>

                                    <!-- Violation Box -->
                                    <template x-if="selectedEvent.is_violation">
                                        <div class="violation-box">
                                            <div class="violation-title">
                                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                                                <span x-text="selectedEvent.invariant_name || 'Invariant Violation'"></span>
                                            </div>
                                            <div class="violation-text" x-text="selectedEvent.violation_explanation || 'A cross-chain invariant was violated during this transaction.'"></div>
                                        </div>
                                    </template>

                                    <!-- Metadata -->
                                    <template x-if="selectedEvent.metadata && Object.keys(selectedEvent.metadata).length > 0">
                                        <div class="detail-row">
                                            <span class="detail-label">Metadata</span>
                                            <div style="background: var(--s3-bg-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto;">
                                                <pre class="font-mono" style="font-size: 11px; color: var(--s3-text-2); margin: 0; white-space: pre-wrap;" x-text="JSON.stringify(selectedEvent.metadata, null, 2)"></pre>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Bottom Summary Section -->
                <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 20px;">
                    <!-- Stats -->
                    <div class="summary-grid">
                        <div class="glass summary-stat">
                            <div class="summary-stat-value" style="color: var(--s3-accent-light);" x-text="events.length"></div>
                            <div class="summary-stat-label">Total Events</div>
                        </div>
                        <div class="glass summary-stat">
                            <div class="summary-stat-value" style="color: var(--s3-critical);" x-text="violationCount"></div>
                            <div class="summary-stat-label">Violations</div>
                        </div>
                        <div class="glass summary-stat">
                            <div class="summary-stat-value" style="color: var(--s3-cyan);" x-text="chains.length"></div>
                            <div class="summary-stat-label">Chains Involved</div>
                        </div>
                        <div class="glass summary-stat">
                            <div class="summary-stat-value" style="color: var(--s3-text-2);" x-text="timeSpan"></div>
                            <div class="summary-stat-label">Time Span</div>
                        </div>
                        <div class="glass summary-stat" x-show="incident?.total_loss_usd">
                            <div class="summary-stat-value" style="color: #fb7185;" x-text="'$' + formatNumber(incident?.total_loss_usd)"></div>
                            <div class="summary-stat-label">Total Loss</div>
                        </div>
                    </div>

                    <!-- Explanation -->
                    <template x-if="explanation">
                        <div class="explanation-box">
                            <div class="explanation-title">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                                Incident Explanation
                            </div>
                            <div class="explanation-text" x-text="explanation"></div>
                        </div>
                    </template>

                    <!-- Recommendations -->
                    <template x-if="recommendations.length > 0">
                        <div class="glass" style="padding: 20px;">
                            <div style="font-size: 13px; font-weight: 600; color: var(--s3-text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                Response Recommendations
                            </div>
                            <ul class="recommendation-list">
                                <template x-for="rec in recommendations" :key="rec">
                                    <li class="recommendation-item">
                                        <svg class="recommendation-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                        <span x-text="rec"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function timelineApp() {
    return {
        // State
        loading: true,
        isDemo: false,
        incident: null,
        events: [],
        chains: [],
        selectedEvent: null,
        explanation: null,
        recommendations: [],

        // Playback
        isPlaying: false,
        currentIndex: -1,
        speed: 1,
        speeds: [0.5, 1, 2, 5],
        playTimer: null,
        screenFlash: false,

        // Arrows
        visibleArrows: [],
        laneHeight: 500,
        playbackLineTop: 0,

        // Computed
        get progressPercent() {
            if (this.events.length === 0) return 0;
            return ((this.currentIndex + 1) / this.events.length) * 100;
        },
        get violationCount() {
            return this.events.filter(e => e.is_violation).length;
        },
        get timeSpan() {
            if (this.events.length < 2) return '--';
            const first = new Date(this.events[0].timestamp);
            const last = new Date(this.events[this.events.length - 1].timestamp);
            const diff = Math.abs(last - first);
            const minutes = Math.floor(diff / 60000);
            if (minutes < 60) return minutes + 'm';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ' + (minutes % 60) + 'm';
            return Math.floor(hours / 24) + 'd ' + (hours % 24) + 'h';
        },

        async init() {
            const params = new URLSearchParams(window.location.search);
            const incidentId = params.get('incident_id');

            if (incidentId) {
                await this.loadIncident(incidentId);
            }

            // If no data, fall back to demo
            if (!this.incident || this.events.length === 0) {
                this.loadDemo();
            }

            this.loading = false;

            // Compute layout after render
            this.$nextTick(() => {
                this.computeLaneHeight();
            });
        },

        async loadIncident(incidentId) {
            try {
                const [incidentResp, eventsResp] = await Promise.all([
                    window.sentinel3Fetch(`/api/incidents/${incidentId}`),
                    window.sentinel3Fetch(`/api/incidents/${incidentId}/events`)
                ]);

                if (incidentResp.ok) {
                    this.incident = await incidentResp.json();
                }

                if (eventsResp.ok) {
                    const rawEvents = await eventsResp.json();
                    if (rawEvents && rawEvents.length > 0) {
                        this.events = this.normalizeEvents(rawEvents);
                    }
                }

                // Try forensics replay endpoint
                try {
                    const replayResp = await window.sentinel3Fetch(`/api/forensics/incident/${incidentId}/replay`);
                    if (replayResp.ok) {
                        const replay = await replayResp.json();
                        if (replay.events && replay.events.length > 0) {
                            this.events = this.normalizeEvents(replay.events);
                        }
                        if (replay.explanation) {
                            this.explanation = typeof replay.explanation === 'string'
                                ? replay.explanation
                                : replay.explanation.summary || JSON.stringify(replay.explanation);
                        }
                    }
                } catch(e) { /* forensics endpoint may not exist */ }

                // Extract explanation from incident
                if (!this.explanation && this.incident?.explanation) {
                    const exp = this.incident.explanation;
                    this.explanation = exp.summary || exp.explanation || (typeof exp === 'string' ? exp : null);
                }

                // Extract recommendations
                if (this.incident?.recommended_actions) {
                    this.recommendations = this.incident.recommended_actions;
                }

                // Build timeline from incident timeline if no events
                if (this.events.length === 0 && this.incident?.timeline?.length > 0) {
                    this.events = this.incident.timeline.map((entry, idx) => ({
                        id: entry.event_id || `tl-${idx}`,
                        chain: entry.chain || 'Unknown',
                        timestamp: entry.timestamp,
                        description: entry.description,
                        tx_hash: entry.tx_hash,
                        severity: entry.severity || 'info',
                        is_violation: (entry.severity === 'critical' || entry.severity === 'high'),
                        _visible: false
                    }));
                }

                // Sort events
                this.events.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                // Extract chains
                this.chains = [...new Set(this.events.map(e => e.chain))].filter(Boolean);

            } catch (e) {
                console.error('Failed to load incident:', e);
            }
        },

        normalizeEvents(rawEvents) {
            return rawEvents.map((e, idx) => ({
                id: e.id || e.event_id || `evt-${idx}`,
                chain: e.chain || e.chain_id || 'Unknown',
                timestamp: e.timestamp,
                description: e.description || e.event_type || 'Event',
                tx_hash: e.tx_hash || '',
                from_address: e.from_address || e.data?.from || null,
                to_address: e.to_address || e.data?.to || null,
                amount: e.amount || e.data?.amount || null,
                severity: e.severity || 'info',
                event_type: e.event_type || null,
                is_violation: e.is_violation || e.severity === 'critical' || false,
                cross_chain_target: e.cross_chain_target || e.data?.target_chain || null,
                invariant_name: e.invariant_name || e.data?.invariant || null,
                violation_explanation: e.violation_explanation || e.data?.violation_reason || null,
                metadata: e.data || e.metadata || {},
                _visible: false
            }));
        },

        loadDemo() {
            this.isDemo = true;
            const baseTime = new Date('2024-02-15T14:30:00Z');

            this.incident = {
                id: 'demo-wormhole-001',
                title: 'Wormhole-Style Bridge Exploit',
                severity: 'critical',
                attack_type: 'bridge_exploit',
                total_loss_usd: 12000000,
                affected_chains: ['Ethereum', 'Polygon', 'Arbitrum'],
                status: 'investigating',
                created_at: baseTime.toISOString()
            };

            this.events = [
                {
                    id: 'evt-1',
                    chain: 'Ethereum',
                    timestamp: new Date(baseTime.getTime()).toISOString(),
                    description: 'Lock 50,000 ETH in bridge contract',
                    tx_hash: '0x7a3b...e4f1',
                    from_address: '0x1234...5678',
                    to_address: '0xBridge...Contract',
                    amount: '50,000 ETH ($125M)',
                    severity: 'info',
                    event_type: 'token_lock',
                    is_violation: false,
                    cross_chain_target: 'Polygon',
                    metadata: { gas_used: '125,000', block: 18950234 },
                    _visible: false
                },
                {
                    id: 'evt-2',
                    chain: 'Polygon',
                    timestamp: new Date(baseTime.getTime() + 120000).toISOString(),
                    description: 'Valid mint of 50,000 wETH',
                    tx_hash: '0x8b2c...d5a2',
                    from_address: '0xBridge...Polygon',
                    to_address: '0x1234...5678',
                    amount: '50,000 wETH',
                    severity: 'info',
                    event_type: 'token_mint',
                    is_violation: false,
                    metadata: { validator_signatures: 13, block: 52341567 },
                    _visible: false
                },
                {
                    id: 'evt-3',
                    chain: 'Polygon',
                    timestamp: new Date(baseTime.getTime() + 300000).toISOString(),
                    description: 'Forged guardian message detected',
                    tx_hash: '0x9c4d...f6b3',
                    from_address: '0xAttacker...addr',
                    to_address: '0xBridge...Polygon',
                    amount: null,
                    severity: 'high',
                    event_type: 'message_forgery',
                    is_violation: false,
                    metadata: { forged_signatures: true, guardian_set_mismatch: true, block: 52341890 },
                    _visible: false
                },
                {
                    id: 'evt-4',
                    chain: 'Polygon',
                    timestamp: new Date(baseTime.getTime() + 360000).toISOString(),
                    description: 'Unbacked mint of 120,000 wETH',
                    tx_hash: '0xad5e...c7d4',
                    from_address: '0xBridge...Polygon',
                    to_address: '0xAttacker...addr',
                    amount: '120,000 wETH ($300M)',
                    severity: 'critical',
                    event_type: 'unbacked_mint',
                    is_violation: true,
                    invariant_name: 'Lock-Mint Supply Invariant',
                    violation_explanation: 'Minted 120,000 wETH on Polygon without corresponding lock on Ethereum. Only 50,000 ETH locked, creating 70,000 unbacked tokens. The guardian verification was bypassed using a forged signature set.',
                    metadata: { locked_on_source: '50,000 ETH', minted_on_target: '170,000 wETH', deficit: '120,000 wETH', block: 52342001 },
                    _visible: false
                },
                {
                    id: 'evt-5',
                    chain: 'Arbitrum',
                    timestamp: new Date(baseTime.getTime() + 480000).toISOString(),
                    description: 'Bridge deposit from Polygon (stolen funds)',
                    tx_hash: '0xbe6f...d8e5',
                    from_address: '0xAttacker...addr',
                    to_address: '0xBridge...Arbitrum',
                    amount: '80,000 wETH ($200M)',
                    severity: 'high',
                    event_type: 'bridge_transfer',
                    is_violation: false,
                    cross_chain_target: null,
                    metadata: { destination_chain: 'Arbitrum', laundering_detected: true, block: 189234567 },
                    _visible: false
                },
                {
                    id: 'evt-6',
                    chain: 'Ethereum',
                    timestamp: new Date(baseTime.getTime() + 540000).toISOString(),
                    description: 'Guardian auto-pause triggered',
                    tx_hash: '0xcf70...e9f6',
                    from_address: '0xGuardian...System',
                    to_address: '0xBridge...Contract',
                    amount: null,
                    severity: 'critical',
                    event_type: 'emergency_pause',
                    is_violation: false,
                    metadata: { trigger_reason: 'supply_invariant_violation', bridge_paused: true, block: 18950456 },
                    _visible: false
                }
            ];

            this.chains = ['Ethereum', 'Polygon', 'Arbitrum'];

            this.explanation = 'This attack exploited a vulnerability in the bridge guardian verification system. The attacker forged guardian signatures to bypass the multi-sig requirement, then minted 120,000 wETH on Polygon without a corresponding lock on Ethereum. The stolen tokens were partially moved to Arbitrum before the automated guardian system detected the supply invariant violation and triggered an emergency bridge pause.';

            this.recommendations = [
                'Immediately freeze affected bridge contracts across all chains',
                'Blacklist attacker address 0xAttacker...addr and track fund movement',
                'Audit guardian signature verification logic for bypass vulnerabilities',
                'Coordinate with Polygon and Arbitrum teams for cross-chain fund recovery',
                'Deploy enhanced invariant monitoring with real-time supply checks',
                'Review and rotate guardian key set as a precautionary measure'
            ];
        },

        // ── Playback Controls ──────────────────────────────
        togglePlay() {
            if (this.isPlaying) {
                this.pause();
            } else {
                this.play();
            }
        },

        play() {
            if (this.currentIndex >= this.events.length - 1) {
                this.reset();
            }
            this.isPlaying = true;
            this.advancePlayback();
        },

        pause() {
            this.isPlaying = false;
            if (this.playTimer) {
                clearTimeout(this.playTimer);
                this.playTimer = null;
            }
        },

        advancePlayback() {
            if (!this.isPlaying) return;
            if (this.currentIndex >= this.events.length - 1) {
                this.pause();
                return;
            }

            this.stepForward();

            const delay = 1000 / this.speed;
            this.playTimer = setTimeout(() => this.advancePlayback(), delay);
        },

        stepForward() {
            if (this.currentIndex < this.events.length - 1) {
                this.currentIndex++;
                this.showEvent(this.currentIndex);
            }
        },

        stepBack() {
            if (this.currentIndex > 0) {
                // Hide current event
                this.events[this.currentIndex]._visible = false;
                this.currentIndex--;
                this.selectEvent(this.events[this.currentIndex]);
                this.updateArrows();
                this.updatePlaybackLine();
            }
        },

        showEvent(index) {
            const evt = this.events[index];
            evt._visible = true;
            this.selectEvent(evt);

            // Trigger violation flash
            if (evt.is_violation) {
                this.screenFlash = true;
                setTimeout(() => { this.screenFlash = false; }, 300);
            }

            this.updateArrows();
            this.updatePlaybackLine();

            // Scroll event into view
            this.$nextTick(() => {
                const card = document.querySelector(`.event-card.active`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        },

        selectEvent(evt) {
            this.selectedEvent = evt;
        },

        seekToPosition(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const pct = (event.clientX - rect.left) / rect.width;
            const targetIndex = Math.floor(pct * this.events.length);
            this.seek(Math.max(0, Math.min(targetIndex, this.events.length - 1)));
        },

        seek(index) {
            // Show all events up to index
            for (let i = 0; i <= index; i++) {
                this.events[i]._visible = true;
            }
            // Hide events after index
            for (let i = index + 1; i < this.events.length; i++) {
                this.events[i]._visible = false;
            }
            this.currentIndex = index;
            this.selectEvent(this.events[index]);
            this.updateArrows();
            this.updatePlaybackLine();
        },

        setSpeed(s) {
            this.speed = s;
        },

        reset() {
            this.pause();
            this.currentIndex = -1;
            this.selectedEvent = null;
            this.visibleArrows = [];
            this.events.forEach(e => e._visible = false);
            this.playbackLineTop = 0;
        },

        // ── Arrow Calculations ──────────────────────────────
        updateArrows() {
            const arrows = [];
            const visibleEvents = this.events.filter((e, i) => i <= this.currentIndex && e._visible);

            for (const evt of visibleEvents) {
                if (evt.cross_chain_target) {
                    const sourceChainIdx = this.chains.indexOf(evt.chain);
                    const targetChainIdx = this.chains.indexOf(evt.cross_chain_target);
                    if (sourceChainIdx >= 0 && targetChainIdx >= 0) {
                        const evtIdx = this.events.indexOf(evt);
                        const laneWidth = 1000 / this.chains.length;
                        const yBase = 60 + evtIdx * 90;

                        arrows.push({
                            id: evt.id + '-arrow',
                            x1: sourceChainIdx * laneWidth + laneWidth / 2,
                            y1: yBase + 30,
                            x2: targetChainIdx * laneWidth + laneWidth / 2,
                            y2: yBase + 60,
                            violation: evt.is_violation
                        });
                    }
                }
            }
            this.visibleArrows = arrows;
        },

        updatePlaybackLine() {
            if (this.currentIndex < 0) {
                this.playbackLineTop = 0;
                return;
            }
            // Approximate position based on event card positions
            const headerHeight = 44; // lane-headers height
            const cardHeight = 90;
            const evtChainIndex = this.getEventLanePosition(this.events[this.currentIndex]);
            this.playbackLineTop = headerHeight + evtChainIndex * cardHeight + cardHeight / 2;
        },

        getEventLanePosition(evt) {
            // Get the chronological index of this event within its chain
            const chainEvents = this.events.filter(e => e.chain === evt.chain);
            const idx = chainEvents.indexOf(evt);
            return this.events.indexOf(evt);
        },

        computeLaneHeight() {
            const maxEventsInLane = Math.max(
                ...this.chains.map(c => this.events.filter(e => e.chain === c).length),
                1
            );
            this.laneHeight = Math.max(500, maxEventsInLane * 110 + 60);
        },

        // ── Chain Helpers ───────────────────────────────────
        getChainColor(chain) {
            const colors = {
                'ethereum': '#3B82F6',
                'polygon': '#8B5CF6',
                'arbitrum': '#06B6D4',
                'solana': '#10B981',
                'bsc': '#F59E0B',
                'avalanche': '#EF4444'
            };
            return colors[chain?.toLowerCase()] || '#64748B';
        },

        getChainClass(chain) {
            const cls = chain?.toLowerCase().replace(/\s+/g, '-');
            const known = ['ethereum', 'polygon', 'arbitrum', 'solana', 'bsc', 'avalanche'];
            return known.includes(cls) ? cls : 'default';
        },

        getEventsForChain(chain) {
            return this.events.filter(e => e.chain === chain);
        },

        getExplorerUrl(chain, txHash) {
            const explorers = {
                'ethereum': 'https://etherscan.io/tx/',
                'polygon': 'https://polygonscan.com/tx/',
                'arbitrum': 'https://arbiscan.io/tx/',
                'solana': 'https://solscan.io/tx/',
                'bsc': 'https://bscscan.com/tx/',
                'avalanche': 'https://snowtrace.io/tx/'
            };
            const base = explorers[chain?.toLowerCase()] || '#';
            return base + (txHash || '');
        },

        // ── Formatting ──────────────────────────────────────
        formatEventTime(ts) {
            if (!ts) return '--';
            const d = new Date(ts);
            return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        },

        formatAttackType(type) {
            if (!type) return 'Unknown';
            return type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        },

        formatNumber(n) {
            if (!n) return '0';
            if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toLocaleString();
        }
    };
}
</script>
