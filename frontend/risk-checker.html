<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Risk Checker - Sentinel3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <!-- DOMPurify for XSS Protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --accent-red: #ff3b3b;
            --accent-orange: #ff8a3b;
            --accent-yellow: #ffd93b;
            --accent-green: #3bff7e;
            --accent-blue: #3b8aff;
            --accent-purple: #8a3bff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a3a;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        
        .risk-gauge {
            background: conic-gradient(
                var(--accent-green) 0deg,
                var(--accent-yellow) 120deg,
                var(--accent-orange) 200deg,
                var(--accent-red) 280deg,
                var(--accent-red) 360deg
            );
        }
        
        .search-input:focus {
            box-shadow: 0 0 0 2px rgba(138, 59, 255, 0.5);
        }
        
        .risk-low { color: var(--accent-green); }
        .risk-medium { color: var(--accent-yellow); }
        .risk-high { color: var(--accent-orange); }
        .risk-critical { color: var(--accent-red); }
        
        .bg-risk-low { background: rgba(59, 255, 126, 0.1); border-color: var(--accent-green); }
        .bg-risk-medium { background: rgba(255, 217, 59, 0.1); border-color: var(--accent-yellow); }
        .bg-risk-high { background: rgba(255, 138, 59, 0.1); border-color: var(--accent-orange); }
        .bg-risk-critical { background: rgba(255, 59, 59, 0.1); border-color: var(--accent-red); }
        
        .factor-bar {
            transition: width 0.5s ease;
        }
        
        .label-tag {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen" x-data="riskChecker()" x-init="init()">
    <!-- Navigation -->
    <nav class="border-b border-gray-800 bg-opacity-50 backdrop-blur-lg sticky top-0 z-50" style="background: rgba(10, 10, 15, 0.9);">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-red-500 to-purple-600 flex items-center justify-center">
                            <span class="text-xl font-bold">S3</span>
                        </div>
                        <span class="text-xl font-bold">Sentinel3</span>
                    </a>
                    <div class="hidden md:flex items-center space-x-6 text-sm">
                        <a href="index.html" class="text-gray-400 hover:text-white transition">Dashboard</a>
                        <a href="protocols.html" class="text-gray-400 hover:text-white transition">Protocols</a>
                        <a href="cross-chain.html" class="text-gray-400 hover:text-white transition">Cross-chain</a>
                        <a href="risk-checker.html" class="text-white font-medium">Risk Checker</a>
                        <a href="logs.html" class="text-gray-400 hover:text-white transition">Logs</a>
                        <a href="analytics.html" class="text-gray-400 hover:text-white transition">Analytics</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4">Wallet Risk Checker</h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">
                Analyze any wallet or contract address for potential risks, suspicious activity, and threat indicators
            </p>
        </div>

        <!-- Search Section -->
        <div class="max-w-3xl mx-auto mb-12">
            <div class="card p-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-400 mb-2">Address</label>
                        <input type="text" 
                               x-model="searchAddress"
                               @keyup.enter="analyzeAddress()"
                               placeholder="0x... or ENS name"
                               class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg search-input focus:outline-none font-mono text-sm">
                    </div>
                    <div class="md:w-48">
                        <label class="block text-sm text-gray-400 mb-2">Chain</label>
                        <select x-model="selectedChain" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none">
                            <option value="ethereum">Ethereum</option>
                            <option value="polygon">Polygon</option>
                            <option value="arbitrum">Arbitrum</option>
                            <option value="optimism">Optimism</option>
                            <option value="base">Base</option>
                            <option value="bsc">BSC</option>
                            <option value="avalanche">Avalanche</option>
                        </select>
                    </div>
                    <div class="md:w-32 flex items-end">
                        <button @click="analyzeAddress()" 
                                :disabled="loading"
                                class="w-full px-6 py-3 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-600 rounded-lg font-medium transition">
                            <span x-show="!loading">Analyze</span>
                            <span x-show="loading" class="flex items-center justify-center">
                                <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
                
                <!-- Quick Examples -->
                <div class="mt-4 flex flex-wrap gap-2">
                    <span class="text-xs text-gray-500">Examples:</span>
                    <button @click="searchAddress = '0xdead...beef'; analyzeAddress()" 
                            class="text-xs text-purple-400 hover:text-purple-300">Known Mixer</button>
                    <button @click="searchAddress = '0x1234...5678'; analyzeAddress()" 
                            class="text-xs text-purple-400 hover:text-purple-300">Normal Wallet</button>
                    <button @click="searchAddress = '0xabcd...ef01'; analyzeAddress()" 
                            class="text-xs text-purple-400 hover:text-purple-300">Contract</button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <template x-if="result">
            <div class="space-y-8">
                <!-- Risk Score Card -->
                <div class="card p-8">
                    <div class="flex flex-col lg:flex-row items-center gap-8">
                        <!-- Risk Gauge -->
                        <div class="relative">
                            <div class="w-48 h-48 rounded-full risk-gauge p-1">
                                <div class="w-full h-full rounded-full bg-gray-900 flex items-center justify-center">
                                    <div class="text-center">
                                        <div class="text-5xl font-bold"
                                             :class="getRiskClass(result.risk_level)"
                                             x-text="Math.round(result.risk_score * 100) + '%'"></div>
                                        <div class="text-sm text-gray-400 mt-1">Risk Score</div>
                                    </div>
                                </div>
                            </div>
                            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 px-4 py-1 rounded-full text-sm font-medium uppercase"
                                 :class="'bg-risk-' + result.risk_level + ' border'"
                                 x-text="result.risk_level"></div>
                        </div>
                        
                        <!-- Address Info -->
                        <div class="flex-1 text-center lg:text-left">
                            <div class="flex items-center justify-center lg:justify-start space-x-3 mb-4">
                                <span class="text-2xl" x-text="result.is_contract ? '📜' : '👛'"></span>
                                <h2 class="text-2xl font-bold" x-text="result.is_contract ? 'Contract' : 'Wallet'"></h2>
                            </div>
                            <div class="font-mono text-sm text-gray-400 break-all mb-4" x-text="result.address"></div>
                            
                            <!-- Labels -->
                            <div class="flex flex-wrap gap-2 justify-center lg:justify-start">
                                <template x-for="label in result.labels" :key="label">
                                    <span class="label-tag px-3 py-1 rounded-full text-xs font-medium"
                                          :class="{
                                              'bg-red-500/20 text-red-400 border border-red-500/30': ['mixer', 'sanctioned', 'scammer', 'exploiter'].includes(label),
                                              'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': ['high_frequency', 'bot', 'suspicious'].includes(label),
                                              'bg-blue-500/20 text-blue-400 border border-blue-500/30': ['exchange', 'dex', 'defi'].includes(label),
                                              'bg-green-500/20 text-green-400 border border-green-500/30': ['verified', 'safe', 'trusted'].includes(label),
                                              'bg-purple-500/20 text-purple-400 border border-purple-500/30': !['mixer', 'sanctioned', 'scammer', 'exploiter', 'high_frequency', 'bot', 'suspicious', 'exchange', 'dex', 'defi', 'verified', 'safe', 'trusted'].includes(label)
                                          }"
                                          x-text="label"></span>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Quick Stats -->
                        <div class="grid grid-cols-2 gap-4">
                            <div class="text-center p-4 bg-gray-800 rounded-lg">
                                <div class="text-2xl font-bold" x-text="result.transaction_count"></div>
                                <div class="text-xs text-gray-400">Transactions</div>
                            </div>
                            <div class="text-center p-4 bg-gray-800 rounded-lg">
                                <div class="text-2xl font-bold" x-text="'$' + formatNumber(result.total_volume_usd)"></div>
                                <div class="text-xs text-gray-400">Total Volume</div>
                            </div>
                            <div class="text-center p-4 bg-gray-800 rounded-lg">
                                <div class="text-2xl font-bold" x-text="result.connected_wallets_count"></div>
                                <div class="text-xs text-gray-400">Connections</div>
                            </div>
                            <div class="text-center p-4 bg-gray-800 rounded-lg">
                                <div class="text-2xl font-bold" :class="result.connected_to_mixer ? 'text-red-400' : 'text-green-400'"
                                     x-text="result.connected_to_mixer ? 'Yes' : 'No'"></div>
                                <div class="text-xs text-gray-400">Mixer Link</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Risk Factors -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Risk Factor Breakdown -->
                    <div class="card p-6">
                        <h3 class="text-lg font-semibold mb-6">Risk Factor Breakdown</h3>
                        <div class="space-y-4">
                            <template x-for="factor in result.risk_factors" :key="factor">
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="capitalize" x-text="factor.replace(/_/g, ' ')"></span>
                                        <span class="font-mono" x-text="getFactorWeight(factor) + '%'"></span>
                                    </div>
                                    <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                                        <div class="factor-bar h-full rounded-full"
                                             :class="getFactorColor(factor)"
                                             :style="'width: ' + getFactorWeight(factor) + '%'"></div>
                                    </div>
                                </div>
                            </template>
                            
                            <template x-if="result.risk_factors.length === 0">
                                <div class="text-center py-8 text-gray-400">
                                    <span class="text-4xl">✅</span>
                                    <p class="mt-2">No risk factors detected</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Activity Timeline -->
                    <div class="card p-6">
                        <h3 class="text-lg font-semibold mb-6">Activity Summary</h3>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between p-3 bg-gray-800 rounded-lg">
                                <div class="flex items-center space-x-3">
                                    <span class="text-xl">📅</span>
                                    <span class="text-gray-400">First Seen</span>
                                </div>
                                <span class="font-mono text-sm" x-text="formatDate(result.first_seen)"></span>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-800 rounded-lg">
                                <div class="flex items-center space-x-3">
                                    <span class="text-xl">⏰</span>
                                    <span class="text-gray-400">Last Activity</span>
                                </div>
                                <span class="font-mono text-sm" x-text="formatDate(result.last_activity)"></span>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-800 rounded-lg">
                                <div class="flex items-center space-x-3">
                                    <span class="text-xl">🔗</span>
                                    <span class="text-gray-400">Chain</span>
                                </div>
                                <span class="font-mono text-sm capitalize" x-text="result.chain_id"></span>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-gray-800 rounded-lg">
                                <div class="flex items-center space-x-3">
                                    <span class="text-xl">🏦</span>
                                    <span class="text-gray-400">Exchange Link</span>
                                </div>
                                <span :class="result.connected_to_exchange ? 'text-blue-400' : 'text-gray-500'"
                                      x-text="result.connected_to_exchange ? 'Yes' : 'No'"></span>
                            </div>
                        </div>
                        
                        <!-- Explorer Link -->
                        <a :href="result.explorer_url" target="_blank" 
                           x-show="result.explorer_url"
                           class="mt-6 flex items-center justify-center space-x-2 p-3 bg-purple-600 hover:bg-purple-700 rounded-lg transition">
                            <span>View on Explorer</span>
                            <span>↗</span>
                        </a>
                    </div>
                </div>

                <!-- Recommendations -->
                <div class="card p-6">
                    <h3 class="text-lg font-semibold mb-4">Recommendations</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="rec in getRecommendations(result)" :key="rec.title">
                            <div class="p-4 rounded-lg"
                                 :class="rec.type === 'danger' ? 'bg-red-500/10 border border-red-500/30' : 
                                         rec.type === 'warning' ? 'bg-yellow-500/10 border border-yellow-500/30' : 
                                         'bg-blue-500/10 border border-blue-500/30'">
                                <div class="flex items-center space-x-2 mb-2">
                                    <span x-text="rec.icon"></span>
                                    <span class="font-medium" x-text="rec.title"></span>
                                </div>
                                <p class="text-sm text-gray-400" x-text="rec.description"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- High Risk Wallets Section -->
        <div class="mt-12">
            <h2 class="text-2xl font-bold mb-6">Recently Flagged High-Risk Addresses</h2>
            <div class="card">
                <div class="divide-y divide-gray-700">
                    <template x-for="wallet in highRiskWallets" :key="wallet.address">
                        <div class="p-4 flex items-center justify-between hover:bg-gray-800/50 cursor-pointer"
                             @click="searchAddress = wallet.address; analyzeAddress()">
                            <div class="flex items-center space-x-4">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center"
                                     :class="'bg-risk-' + wallet.risk_level">
                                    <span x-text="Math.round(wallet.risk_score * 100) + '%'" class="text-xs font-bold"></span>
                                </div>
                                <div>
                                    <div class="font-mono text-sm" x-text="wallet.address.slice(0, 10) + '...' + wallet.address.slice(-8)"></div>
                                    <div class="text-xs text-gray-500" x-text="wallet.chain_id + ' • ' + wallet.event_count + ' events'"></div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="text-right">
                                    <div class="text-sm font-medium capitalize"
                                         :class="'risk-' + wallet.risk_level"
                                         x-text="wallet.risk_level"></div>
                                    <div class="text-xs text-gray-500" x-text="wallet.highest_severity + ' severity'"></div>
                                </div>
                                <span class="text-gray-400">→</span>
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="highRiskWallets.length === 0">
                        <div class="p-8 text-center text-gray-400">
                            <span class="text-4xl">🔍</span>
                            <p class="mt-2">No high-risk wallets detected recently</p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <script>
        function riskChecker() {
            return {
                searchAddress: '',
                selectedChain: 'ethereum',
                loading: false,
                result: null,
                highRiskWallets: [],
                
                async init() {
                    await this.loadHighRiskWallets();
                },
                
                async analyzeAddress() {
                    if (!this.searchAddress) return;
                    
                    this.loading = true;
                    this.result = null;
                    
                    try {
                        const response = await fetch(`/api/analytics/risk/score/${this.searchAddress}?chain_id=${this.selectedChain}`);
                        this.result = await response.json();
                    } catch (error) {
                        console.error('Analysis failed:', error);
                        // Show error state
                        this.result = {
                            address: this.searchAddress,
                            chain_id: this.selectedChain,
                            risk_score: 0,
                            risk_level: 'low',
                            risk_factors: [],
                            labels: ['no_data'],
                            transaction_count: 0,
                            total_volume_usd: 0,
                            connected_wallets_count: 0,
                            connected_to_mixer: false,
                            connected_to_exchange: false,
                            is_contract: false,
                            first_seen: null,
                            last_activity: null,
                            explorer_url: null
                        };
                    }
                    
                    this.loading = false;
                },
                
                async loadHighRiskWallets() {
                    try {
                        const response = await fetch((window.SENTINEL3_API_BASE || '') + '/api/analytics/risk/high-risk-wallets?limit=10');
                        this.highRiskWallets = await response.json();
                    } catch (error) {
                        console.error('Failed to load high-risk wallets:', error);
                    }
                },
                
                getRiskClass(level) {
                    return 'risk-' + level;
                },
                
                getFactorWeight(factor) {
                    const weights = {
                        'connected_to_high_risk_entity': 30,
                        'connected_to_mixer': 30,
                        'connected_to_sanctioned': 35,
                        'high_transaction_frequency': 20,
                        'large_volume_movements': 15,
                        'interaction_with_risky_contract': 25,
                        'high_network_centrality': 10,
                        'suspicious_timing': 15,
                        'new_wallet': 10
                    };
                    return weights[factor] || 15;
                },
                
                getFactorColor(factor) {
                    const weight = this.getFactorWeight(factor);
                    if (weight >= 30) return 'bg-red-500';
                    if (weight >= 20) return 'bg-orange-500';
                    if (weight >= 15) return 'bg-yellow-500';
                    return 'bg-blue-500';
                },
                
                getRecommendations(result) {
                    const recs = [];
                    
                    if (result.risk_level === 'critical') {
                        recs.push({
                            type: 'danger',
                            icon: '🚫',
                            title: 'Block Transactions',
                            description: 'Consider blocking all transactions with this address immediately.'
                        });
                    }
                    
                    if (result.connected_to_mixer) {
                        recs.push({
                            type: 'danger',
                            icon: '🌀',
                            title: 'Mixer Connection',
                            description: 'This address has interacted with known mixing services.'
                        });
                    }
                    
                    if (result.risk_level === 'high' || result.risk_level === 'critical') {
                        recs.push({
                            type: 'warning',
                            icon: '👁️',
                            title: 'Enhanced Monitoring',
                            description: 'Enable enhanced monitoring for all transactions involving this address.'
                        });
                    }
                    
                    if (result.transaction_count > 1000) {
                        recs.push({
                            type: 'info',
                            icon: '📊',
                            title: 'High Activity',
                            description: 'This is a high-activity address. Consider rate limiting interactions.'
                        });
                    }
                    
                    if (result.risk_level === 'low') {
                        recs.push({
                            type: 'info',
                            icon: '✅',
                            title: 'Low Risk',
                            description: 'No immediate concerns detected. Continue standard monitoring.'
                        });
                    }
                    
                    return recs;
                },
                
                formatNumber(num) {
                    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                    return num?.toFixed(0) || '0';
                },
                
                formatDate(dateStr) {
                    if (!dateStr) return 'Unknown';
                    return new Date(dateStr).toLocaleDateString();
                }
            };
        }
    </script>
</body>
</html>
